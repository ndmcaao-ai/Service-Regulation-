<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Tax Act Master Quiz (TDS Chapter & Exemptions) - 75 Questions</title>
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary-color: #0d9488;
      --primary-hover: #0f766e;
      --secondary-bg: #f3f4f6;
      --success-color: #059669;
      --success-bg: #d1fae5;
      --danger-color: #dc2626;
      --danger-bg: #fee2e2;
      --warning-color: #d97706;
      --warning-bg: #fef3c7;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --palette-unvisited: #e5e7eb;
      --palette-unvisited-text: #374151;
      --palette-answered: #0d9488;
      --palette-answered-text: #ffffff;
    }

    body.dark-mode {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary-color: #14b8a6;
      --primary-hover: #2dd4bf;
      --secondary-bg: #334155;
      --success-color: #10b981;
      --success-bg: #064e3b;
      --danger-color: #f87171;
      --danger-bg: #7f1d1d;
      --warning-color: #fbbf24;
      --warning-bg: #78350f;
      --palette-unvisited: #334155;
      --palette-unvisited-text: #cbd5e1;
      --palette-answered: #14b8a6;
      --palette-answered-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .header-titles h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .header-titles p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .timer-badge {
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      background-color: var(--secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .timer-badge.warning {
      background-color: var(--danger-bg);
      color: var(--danger-color);
      border-color: var(--danger-color);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.7; }
    }

    .btn {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--secondary-bg);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      filter: brightness(0.95);
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    .btn-danger:hover {
      filter: brightness(0.9);
    }

    /* Main Container Grid */
    .container {
      max-width: 1280px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      flex: 1;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Question Card */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .question-index {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .bookmark-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .bookmark-btn.active {
      color: var(--warning-color);
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    /* Options List */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .option-card {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      background-color: var(--bg-card);
    }

    .option-card:hover {
      border-color: var(--primary-color);
      background-color: var(--secondary-bg);
    }

    .option-card.selected {
      border-color: var(--primary-color);
      background-color: var(--secondary-bg);
      box-shadow: 0 0 0 1px var(--primary-color);
    }

    .option-card.correct-review {
      border-color: var(--success-color);
      background-color: var(--success-bg);
      color: var(--text-main);
    }

    .option-card.incorrect-review {
      border-color: var(--danger-color);
      background-color: var(--danger-bg);
      color: var(--text-main);
    }

    .radio-custom {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-color);
      border-radius: 50%;
      margin-top: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-card.selected .radio-custom {
      border-color: var(--primary-color);
    }

    .option-card.selected .radio-custom::after {
      content: "";
      width: 10px;
      height: 10px;
      background-color: var(--primary-color);
      border-radius: 50%;
    }

    .option-label {
      font-size: 0.95rem;
      line-height: 1.4;
      flex: 1;
    }

    /* Bottom Action Bar */
    .card-actions {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .action-group {
      display: flex;
      gap: 0.5rem;
    }

    /* Explanation Box */
    .explanation-box {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      background-color: var(--secondary-bg);
      border-left: 4px solid var(--primary-color);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .explanation-title {
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--primary-color);
    }

    /* Sidebar / Palette */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .filter-tabs {
      display: flex;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background-color: var(--bg-card);
    }

    .tab-btn {
      flex: 1;
      padding: 0.5rem 0.2rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      max-height: 400px;
      overflow-y: auto;
      padding: 0.25rem;
    }

    .palette-item {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      background-color: var(--palette-unvisited);
      color: var(--palette-unvisited-text);
      position: relative;
      transition: all 0.2s;
    }

    .palette-item.active-current {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }

    .palette-item.answered {
      background-color: var(--palette-answered);
      color: var(--palette-answered-text);
      border-color: var(--palette-answered);
    }

    .palette-item.bookmarked::after {
      content: "★";
      position: absolute;
      top: 1px;
      right: 3px;
      font-size: 0.65rem;
      color: var(--warning-color);
    }

    .palette-item.correct-post {
      background-color: var(--success-color);
      color: #ffffff;
      border-color: var(--success-color);
    }

    .palette-item.incorrect-post {
      background-color: var(--danger-color);
      color: #ffffff;
      border-color: var(--danger-color);
    }

    .legend-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--bg-card);
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      padding: 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .modal-score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-color);
      margin: 1rem 0;
    }

    .performance-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .badge-excellent { background-color: var(--success-bg); color: var(--success-color); }
    .badge-passed { background-color: var(--warning-bg); color: var(--warning-color); }
    .badge-failed { background-color: var(--danger-bg); color: var(--danger-color); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      text-align: left;
      font-size: 0.9rem;
    }

    .summary-item {
      padding: 0.5rem;
      background-color: var(--secondary-bg);
      border-radius: 4px;
    }

    .summary-item span {
      font-weight: 700;
      float: right;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-titles">
      <h1>Income Tax Act (Focus: TDS Chapter & Exemptions)</h1>
      <p>Interactive Statutory Assessment Engine - 75 Comprehensive Questions</p>
    </div>
    <div class="header-controls">
      <div id="timerDisplay" class="timer-badge">45:00</div>
      <button id="restartBtn" class="btn btn-secondary" title="Reshuffle & Restart">🔄 Restart</button>
      <button id="themeToggleBtn" class="btn btn-secondary" title="Toggle Light/Dark Mode">🌙</button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="container">
    <!-- Left Column: Active Question -->
    <main class="card">
      <div class="question-header">
        <span id="questionIndexDisplay" class="question-index">Question 1 of 75</span>
        <button id="bookmarkToggleBtn" class="bookmark-btn" title="Bookmark Question">★</button>
      </div>
      <div id="questionTextDisplay" class="question-text">Loading question...</div>
      
      <div id="optionsContainer" class="options-list"></div>

      <div id="explanationContainer"></div>

      <div class="card-actions">
        <div class="action-group">
          <button id="prevBtn" class="btn btn-secondary">Previous</button>
          <button id="nextBtn" class="btn btn-secondary">Next</button>
        </div>
        <div class="action-group">
          <button id="clearBtn" class="btn btn-secondary">Clear Selection</button>
          <button id="submitBtn" class="btn btn-danger">Submit Quiz</button>
        </div>
      </div>
    </main>

    <!-- Right Column: Palette & Filters -->
    <aside class="sidebar">
      <div class="card">
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">All</button>
          <button class="tab-btn" data-filter="answered">Answered</button>
          <button class="tab-btn" data-filter="unanswered">Unanswered</button>
          <button class="tab-btn" data-filter="bookmarked">Bookmarked</button>
        </div>
        <div id="paletteGrid" class="palette-grid" style="margin-top: 1rem;"></div>
        <div class="legend-box">
          <div class="legend-item"><div class="legend-color" style="background: var(--palette-unvisited);"></div> Unanswered</div>
          <div class="legend-item"><div class="legend-color" style="background: var(--palette-answered);"></div> Answered</div>
          <div class="legend-item"><div class="legend-color" style="background: var(--success-color);"></div> Correct</div>
          <div class="legend-item"><div class="legend-color" style="background: var(--danger-color);"></div> Incorrect</div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Results Modal -->
  <div id="resultsModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Assessment Complete</h2>
      <div id="modalScoreDisplay" class="modal-score">0 / 75</div>
      <div id="modalBadge" class="performance-badge">Passed</div>
      
      <div class="summary-grid">
        <div class="summary-item">Total Answered <span id="summaryAnswered">0</span></div>
        <div class="summary-item">Correct <span id="summaryCorrect">0</span></div>
        <div class="summary-item">Incorrect <span id="summaryIncorrect">0</span></div>
        <div class="summary-item">Skipped <span id="summarySkipped">0</span></div>
      </div>

      <div style="display: flex; gap: 0.5rem; justify-content: center;">
        <button id="reviewModeBtn" class="btn btn-primary">Review Detailed Answers</button>
        <button id="modalRestartBtn" class="btn btn-secondary">Restart Quiz</button>
      </div>
    </div>
  </div>

  <script>
    // 75 High-Quality Questions focusing on TDS Chapter and Exemptions under Income Tax framework
    const rawQuestionsData = [
      {
        id: 1,
        question: "What is the primary legal objective of Tax Deduction at Source (TDS) under the Income Tax statutory framework?",
        options: ["To collect tax at the very source of income generation, ensuring regular revenue flow and curbing tax evasion", "To impose penalties on taxpayers before filing returns", "To replace all forms of direct corporate tax liabilities", "To levy municipal tolls on commercial entities"],
        correctIndex: 0,
        explanation: "TDS ensures regular collection of tax at the source of income generation, widening the tax net and curbing evasion."
      },
      {
        id: 2,
        question: "Under which chapter of the Income Tax Act are provisions relating to Tax Deduction at Source (TDS) primarily housed?",
        options: ["Chapter XVII-B", "Chapter VI-A", "Chapter IV-D", "Chapter XII-A"],
        correctIndex: 0,
        explanation: "Chapter XVII-B (Sections 192 to 206V) contains the statutory provisions governing TDS."
      },
      {
        id: 3,
        question: "Which section mandates tax deduction at source on 'Salaries'?",
        options: ["Section 192", "Section 194C", "Section 194J", "Section 194A"],
        correctIndex: 0,
        explanation: "Section 192 governs tax deduction at source on salaries paid by an employer to an employee."
      },
      {
        id: 4,
        question: "Under Section 192, who is responsible for deducting tax from salary payments?",
        options: ["The employer making payment of salary", "The employee receiving salary", "The local bank branch manager", "The Income Tax Commissioner"],
        correctIndex: 0,
        explanation: "Section 192 requires any person responsible for paying 'Salary' to deduct income tax at the time of payment based on estimated average income tax rates."
      },
      {
        id: 5,
        question: "Which section governs tax deduction on interest other than interest on securities (such as bank fixed deposits)?",
        options: ["Section 194A", "Section 194B", "Section 194H", "Section 194I"],
        correctIndex: 0,
        explanation: "Section 194A covers TDS on interest other than interest on securities."
      },
      {
        id: 6,
        question: "Under Section 194A, are banks required to deduct TDS on interest paid on time deposits if total interest does not exceed the threshold limit (e.g., Rs. 40,000 for general citizens / Rs. 50,000 for senior citizens)?",
        options: ["No, TDS is not required if interest does not exceed the prescribed threshold limit", "Yes, TDS must be deducted from the very first rupee", "Only if depositor submits a passport", "Only on Sundays"],
        correctIndex: 0,
        explanation: "Section 194A provides threshold exemptions (Rs. 40,000 for general / Rs. 50,000 for senior citizens) below which banks need not deduct TDS."
      },
      {
        id: 7,
        question: "Which section deals with TDS on winnings from lotteries, crossword puzzles, card games, or other games of any sort?",
        options: ["Section 194B", "Section 194C", "Section 194EE", "Section 194G"],
        correctIndex: 0,
        explanation: "Section 194B mandates tax deduction on winnings from lotteries, crossword puzzles, or games exceeding prescribed limits."
      },
      {
        id: 8,
        question: "Which section governs TDS on payments made to contractors and sub-contractors for carrying out any work (including supply of labour for carrying out work)?",
        options: ["Section 194C", "Section 194J", "Section 194I", "Section 194EE"],
        correctIndex: 0,
        explanation: "Section 194C governs tax deduction on payments to contractors and sub-contractors."
      },
      {
        id: 9,
        question: "Under Section 194C, what is the threshold for single contract payment and aggregate payments during a financial year?",
        options: ["Single payment exceeding Rs. 30,000 or aggregate payments exceeding Rs. 1,00,000 in a financial year", "Rs. 5,000 single payment", "Rs. 10,000 aggregate", "No threshold exists"],
        correctIndex: 0,
        explanation: "Section 194C triggers TDS if single contract payment exceeds Rs. 30,000 or aggregate payments exceed Rs. 1,00,000 in a financial year."
      },
      {
        id: 10,
        question: "Which section governs tax deduction on insurance commission paid to agents?",
        options: ["Section 194D", "Section 194G", "Section 194H", "Section 194EE"],
        correctIndex: 0,
        explanation: "Section 194D mandates TDS on insurance commission."
      },
      {
        id: 11,
        question: "Which section covers TDS on commission or brokerage (other than insurance commission)?",
        options: ["Section 194H", "Section 194D", "Section 194C", "Section 194I"],
        correctIndex: 0,
        explanation: "Section 194H governs TDS on commission or brokerage payments."
      },
      {
        id: 12,
        question: "Which section governs TDS on rent payments (land, building, or furniture)?",
        options: ["Section 194I", "Section 194C", "Section 194A", "Section 194J"],
        correctIndex: 0,
        explanation: "Section 194I mandates tax deduction on rent paid for land, building, or furniture/fixtures."
      },
      {
        id: 13,
        question: "Which section covers TDS on payment of fees for professional or technical services (FTS), royalty, or non-executive director remuneration?",
        options: ["Section 194J", "Section 194C", "Section 194H", "Section 194A"],
        correctIndex: 0,
        explanation: "Section 194J governs TDS on professional or technical services and royalty."
      },
      {
        id: 14,
        question: "Which section mandates tax deduction on the transfer of certain immovable property (other than agricultural land) where consideration exceeds Rs. 50 lakhs?",
        options: ["Section 194-IA", "Section 194C", "Section 194I", "Section 194-IC"],
        correctIndex: 0,
        explanation: "Section 194-IA requires the buyer of immovable property (exceeding Rs. 50 lakhs) to deduct TDS at 1%."
      },
      {
        id: 15,
        question: "Which section governs TDS on rent by certain individuals or Hindu Undivided Families (HUF) not covered under regular tax audit, where monthly rent exceeds Rs. 50,000?",
        options: ["Section 194-IB", "Section 194I", "Section 194C", "Section 194J"],
        correctIndex: 0,
        explanation: "Section 194-IB requires individuals/HUFs not subject to tax audit to deduct TDS at 5% on monthly rent exceeding Rs. 50,000."
      },
      {
        id: 16,
        question: "Which section mandates TDS on payments made by individuals/HUFs (not under tax audit) to contractors or professionals for contractual or professional services exceeding Rs. 50,000 in a year?",
        options: ["Section 194M", "Section 194C", "Section 194J", "Section 194-IA"],
        correctIndex: 0,
        explanation: "Section 194M covers TDS by individuals and HUFs not covered under 194C/194J audit on contractual/professional payments exceeding Rs. 50,000 in a year."
      },
      {
        id: 17,
        question: "Which section governs TDS on cash withdrawals exceeding Rs. 1 crore from a bank account in a financial year?",
        options: ["Section 194N", "Section 194A", "Section 194B", "Section 194EE"],
        correctIndex: 0,
        explanation: "Section 194N mandates TDS on cash withdrawals exceeding Rs. 1 crore (or Rs. 20 lakhs for non-filers) from banking companies, cooperatives, or post offices."
      },
      {
        id: 18,
        question: "Which section covers TDS on purchase of goods exceeding Rs. 50 lakhs in value by a buyer whose turnover exceeds Rs. 10 crores in the preceding financial year?",
        options: ["Section 194Q", "Section 194C", "Section 194J", "Section 194-IA"],
        correctIndex: 0,
        explanation: "Section 194Q requires a buyer (with turnover > Rs. 10 crores) to deduct TDS on purchase of goods exceeding Rs. 50 lakhs from a resident seller."
      },
      {
        id: 19,
        question: "Which section mandates TDS on benefit or perk arising from business or profession (such as free gifts or foreign trips provided to business clients/doctors)?",
        options: ["Section 194R", "Section 194H", "Section 194J", "Section 194B"],
        correctIndex: 0,
        explanation: "Section 194R requires deduction of tax on perquisites or benefits arising from business or profession exceeding Rs. 20,000 in a financial year."
      },
      {
        id: 20,
        question: "Which section mandates TDS on net winnings from online games?",
        options: ["Section 194BA", "Section 194B", "Section 194C", "Section 194BB"],

    // Fisher-Yates Shuffle Algorithm
    function fisherYatesShuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Initialize/Reset Quiz Data Engine
    function initQuizData() {
      // Deep copy and shuffle questions
      shuffledQuestions = fisherYatesShuffle(rawQuestionsData).map(q => {
        // Prepare options array with original indices tracked
        const optionsObj = q.options.map((optText, index) => ({
          text: optText,
          originalIndex: index
        }));
        
        // Shuffle options
        const shuffledOptions = fisherYatesShuffle(optionsObj);
        
        // Find new correct index
        const newCorrectIndex = shuffledOptions.findIndex(o => o.originalIndex === q.correctIndex);

        return {
          id: q.id,
          question: q.question,
          options: shuffledOptions,
          correctIndex: newCorrectIndex,
          explanation: q.explanation
        };
      });

      // Reset runtime state
      currentQuestionIndex = 0;
      userAnswers = {};
      bookmarks.clear();
      isSubmitted = false;
      activeFilter = 'all';

      // Reset Timer
      clearInterval(timerInterval);
      timeRemaining = TOTAL_TIME_SECONDS;
      updateTimerUI();
      startTimer();

      // Reset UI Controls
      submitBtn.disabled = false;
      clearBtn.disabled = false;
      resultsModal.classList.remove('open');

      renderFilterTabs();
      renderCurrentQuestion();
      renderPalette();
    }

    // Timer Logic
    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerUI();

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          autoSubmitQuiz();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      timerDisplay.textContent = formatted;

      if (timeRemaining < 300) { // < 5 mins
        timerDisplay.classList.add('warning');
      } else {
        timerDisplay.classList.remove('warning');
      }
    }

    // Render Question Card
    function renderCurrentQuestion() {
      const q = shuffledQuestions[currentQuestionIndex];
      
      questionIndexDisplay.textContent = `Question ${currentQuestionIndex + 1} of ${shuffledQuestions.length}`;
      questionTextDisplay.textContent = q.question;

      // Bookmark state
      if (bookmarks.has(currentQuestionIndex)) {
        bookmarkToggleBtn.classList.add('active');
      } else {
        bookmarkToggleBtn.classList.remove('active');
      }

      // Render Options
      optionsContainer.innerHTML = '';
      const selectedOption = userAnswers[currentQuestionIndex];

      q.options.forEach((opt, idx) => {
        const optionCard = document.createElement('div');
        optionCard.className = 'option-card';

        // Apply review styling if submitted
        if (isSubmitted) {
          if (idx === q.correctIndex) {
            optionCard.classList.add('correct-review');
          } else if (selectedOption === idx && selectedOption !== q.correctIndex) {
            optionCard.classList.add('incorrect-review');
          }
        } else if (selectedOption === idx) {
          optionCard.classList.add('selected');
        }

        optionCard.innerHTML = `
          <div class="radio-custom"></div>
          <div class="option-label">${opt.text}</div>
        `;

        if (!isSubmitted) {
          optionCard.addEventListener('click', () => selectOption(idx));
        }

        optionsContainer.appendChild(optionCard);
      });

      // Render Explanation in Review Mode
      explanationContainer.innerHTML = '';
      if (isSubmitted) {
        const expBox = document.createElement('div');
        expBox.className = 'explanation-box';
        expBox.innerHTML = `
          <div class="explanation-title">Statutory Clause & Reference:</div>
          <div>${q.explanation}</div>
        `;
        explanationContainer.appendChild(expBox);
      }

      // Update Navigation Buttons
      prevBtn.disabled = currentQuestionIndex === 0;
      nextBtn.disabled = currentQuestionIndex === shuffledQuestions.length - 1;

      renderPalette();
    }

    // Select Option
    function selectOption(optionIndex) {
      if (isSubmitted) return;
      userAnswers[currentQuestionIndex] = optionIndex;
      renderCurrentQuestion();
    }

    // Clear Selection
    clearBtn.addEventListener('click', () => {
      if (isSubmitted) return;
      delete userAnswers[currentQuestionIndex];
      renderCurrentQuestion();
    });

    // Bookmark Toggle
    bookmarkToggleBtn.addEventListener('click', () => {
      if (bookmarks.has(currentQuestionIndex)) {
        bookmarks.delete(currentQuestionIndex);
      } else {
        bookmarks.add(currentQuestionIndex);
      }
      renderCurrentQuestion();
    });

    // Navigation Events
    prevBtn.addEventListener('click', () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderCurrentQuestion();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentQuestionIndex < shuffledQuestions.length - 1) {
        currentQuestionIndex++;
        renderCurrentQuestion();
      }
    });

    // Palette Rendering & Filter Logic
    function renderPalette() {
      paletteGrid.innerHTML = '';

      shuffledQuestions.forEach((q, idx) => {
        const isAnswered = userAnswers.hasOwnProperty(idx);
        const isBookmarked = bookmarks.has(idx);

        // Filter Evaluation
        if (activeFilter === 'answered' && !isAnswered) return;
        if (activeFilter === 'unanswered' && isAnswered) return;
        if (activeFilter === 'bookmarked' && !isBookmarked) return;

        const item = document.createElement('div');
        item.className = 'palette-item';
        item.textContent = idx + 1;

        if (idx === currentQuestionIndex) {
          item.classList.add('active-current');
        }

        if (isBookmarked) {
          item.classList.add('bookmarked');
        }

        if (isSubmitted) {
          const userAns = userAnswers[idx];
          if (userAns === q.correctIndex) {
            item.classList.add('correct-post');
          } else if (userAns !== undefined) {
            item.classList.add('incorrect-post');
          }
        } else if (isAnswered) {
          item.classList.add('answered');
        }

        item.addEventListener('click', () => {
          currentQuestionIndex = idx;
          renderCurrentQuestion();
        });

        paletteGrid.appendChild(item);
      });
    }

    // Filter Tab Buttons
    function renderFilterTabs() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
          tabs.forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          activeFilter = e.target.getAttribute('data-filter');
          renderPalette();
        });
      });
    }

    // Submit Quiz & Show Results
    function submitQuiz() {
      if (isSubmitted) return;
      isSubmitted = true;
      clearInterval(timerInterval);

      // Score Calculation
      let correctCount = 0;
      let incorrectCount = 0;
      let answeredCount = 0;

      shuffledQuestions.forEach((q, idx) => {
        if (userAnswers.hasOwnProperty(idx)) {
          answeredCount++;
          if (userAnswers[idx] === q.correctIndex) {
            correctCount++;
          } else {
            incorrectCount++;
          }
        }
      });

      const totalCount = shuffledQuestions.length;
      const skippedCount = totalCount - answeredCount;
      const percentage = Math.round((correctCount / totalCount) * 100);

      // Modal Elements
      document.getElementById('modalScoreDisplay').textContent = `${correctCount} / ${totalCount} (${percentage}%)`;
      document.getElementById('summaryAnswered').textContent = answeredCount;
      document.getElementById('summaryCorrect').textContent = correctCount;
      document.getElementById('summaryIncorrect').textContent = incorrectCount;
      document.getElementById('summarySkipped').textContent = skippedCount;

      const badge = document.getElementById('modalBadge');
      if (percentage >= 80) {
        badge.textContent = "Excellent";
        badge.className = "performance-badge badge-excellent";
      } else if (percentage >= 50) {
        badge.textContent = "Passed";
        badge.className = "performance-badge badge-passed";
      } else {
        badge.textContent = "Failed";
        badge.className = "performance-badge badge-failed";
      }

      resultsModal.classList.add('open');
      renderCurrentQuestion();
    }

    function autoSubmitQuiz() {
      alert("Time has expired! Automatically submitting your quiz.");
      submitQuiz();
    }

    submitBtn.addEventListener('click', () => {
      if (confirm("Are you sure you want to submit your quiz?")) {
        submitQuiz();
      }
    });

    // Review & Restart Handlers
    document.getElementById('reviewModeBtn').addEventListener('click', () => {
      resultsModal.classList.remove('open');
    });

    document.getElementById('modalRestartBtn').addEventListener('click', () => {
      initQuizData();
    });

    restartBtn.addEventListener('click', () => {
      if (confirm("Restarting will shuffle all questions and clear active progress. Proceed?")) {
        initQuizData();
      }
    });

    // Dark/Light Theme Switcher
    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      if (document.body.classList.contains('dark-mode')) {
        themeToggleBtn.textContent = '☀️';
      } else {
        themeToggleBtn.textContent = '🌙';
      }
    });

    // Initialize Engine On Load
    window.addEventListener('DOMContentLoaded', () => {
      initQuizData();
    });
  </script>
</body>
</html>
