<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right to Information Act, 2005 - Interactive Practice Quiz</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #cbd5e1;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --warning: #d97706;
            --warning-light: #fffbeb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #334155;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: #1e3a8a;
            --success: #22c55e;
            --success-light: #14532d;
            --danger: #ef4444;
            --danger-light: #7f1d1d;
            --warning: #f59e0b;
            --warning-light: #78350f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-title h1 {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .badge {
            background-color: var(--accent-light);
            color: var(--accent-primary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Timer Widget */
        .timer-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--accent-light);
            color: var(--accent-primary);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            font-family: monospace;
            border: 1px solid var(--border-color);
        }

        .timer-box.warning {
            background-color: var(--warning-light);
            color: var(--warning);
            animation: pulse 1s infinite;
        }

        .timer-box.danger {
            background-color: var(--danger-light);
            color: var(--danger);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn-header {
            padding: 0.45rem 0.85rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-header:hover {
            background-color: var(--bg-primary);
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .icon-btn:hover {
            background-color: var(--border-color);
        }

        /* Container Layout */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.5rem;
            flex: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Question Section */
        .main-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 480px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .question-number {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .bookmark-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-weight: 600;
        }

        .bookmark-btn.active {
            color: var(--warning);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            background-color: var(--bg-card);
            font-size: 0.95rem;
            color: var(--text-primary);
            position: relative;
        }

        .option-item:hover {
            border-color: var(--accent-primary);
            background-color: var(--accent-light);
        }

        .option-item.selected {
            border-color: var(--accent-primary);
            background-color: var(--accent-light);
            font-weight: 500;
        }

        .option-prefix {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            background-color: var(--bg-primary);
        }

        .option-item.selected .option-prefix {
            background-color: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
        }

        /* Review Mode Option Styles */
        .option-item.correct {
            border-color: var(--success) !important;
            background-color: var(--success-light) !important;
            color: var(--text-primary);
        }

        .option-item.correct .option-prefix {
            background-color: var(--success);
            color: #ffffff;
            border-color: var(--success);
        }

        .option-item.wrong {
            border-color: var(--danger) !important;
            background-color: var(--danger-light) !important;
            color: var(--text-primary);
        }

        .option-item.wrong .option-prefix {
            background-color: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 1rem;
            padding: 1rem;
            background-color: var(--accent-light);
            border-left: 4px solid var(--accent-primary);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .explanation-box strong {
            color: var(--text-primary);
            display: block;
            margin-bottom: 0.25rem;
        }

        /* Navigation Bar */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-secondary {
            background-color: var(--bg-primary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Sidebar Palette */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .palette-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-md);
        }

        .palette-header {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-select {
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.8rem;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .palette-item {
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .palette-item:hover {
            border-color: var(--accent-primary);
        }

        .palette-item.current {
            outline: 2px solid var(--accent-primary);
            outline-offset: 1px;
        }

        .palette-item.answered {
            background-color: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
        }

        .palette-item.bookmarked::after {
            content: '★';
            position: absolute;
            top: 1px;
            right: 2px;
            font-size: 0.65rem;
            color: var(--warning);
        }

        /* Review Mode Palette Status */
        .palette-item.status-correct {
            background-color: var(--success) !important;
            color: #ffffff !important;
            border-color: var(--success) !important;
        }

        .palette-item.status-wrong {
            background-color: var(--danger) !important;
            color: #ffffff !important;
            border-color: var(--danger) !important;
        }

        .palette-item.status-unattempted {
            background-color: var(--bg-primary) !important;
            color: var(--text-muted) !important;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .legend-color {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 2px;
        }

        /* Modal Score Card */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--accent-light);
            color: var(--accent-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            border: 4px solid var(--accent-primary);
        }

        .score-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .score-total {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin: 1.5rem 0;
        }

        .stat-box {
            background-color: var(--bg-primary);
            padding: 0.6rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .stat-val {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* Message Banner */
        .alert-banner {
            display: none;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .alert-banner.info {
            background-color: var(--accent-light);
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Right to Information Act, 2005</h1>
            <span class="badge">Interactive Practice Quiz</span>
        </div>
        <div class="header-actions">
            <div id="timer" class="timer-box" title="Time Remaining">
                ⏱️ <span id="timer-display">30:00</span>
            </div>
            <button class="btn-header" id="restart-btn" title="Reshuffle questions and restart timer">
                🔄 Reshuffle & Restart
            </button>
            <button class="icon-btn" id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
        </div>
    </header>

    <div class="container">
        <!-- Main Quiz Section -->
        <main class="main-card fade-in" id="main-card">
            <div>
                <div id="status-banner" class="alert-banner info"></div>

                <div class="question-header">
                    <span class="question-number" id="q-number">Question 1 of 50</span>
                    <button class="bookmark-btn" id="bookmark-btn" title="Bookmark Question">
                        <span id="bookmark-icon">☆</span> Bookmark
                    </button>
                </div>
                
                <div class="question-text" id="q-text">
                    Loading Question...
                </div>

                <div class="options-list" id="options-container">
                    <!-- Dynamic Options -->
                </div>

                <div id="explanation-container" style="display: none;">
                    <!-- Explanation shown post-submission -->
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="nav-controls">
                <div>
                    <button class="btn btn-secondary" id="prev-btn">← Previous</button>
                    <button class="btn btn-secondary" id="clear-btn">Clear Selection</button>
                </div>
                <div>
                    <button class="btn btn-primary" id="next-btn">Next →</button>
                    <button class="btn btn-danger" id="submit-btn">Submit Quiz</button>
                </div>
            </div>
        </main>

        <!-- Sidebar / Palette -->
        <aside class="sidebar">
            <div class="palette-card">
                <div class="palette-header">
                    <span>Question Palette</span>
                    <select id="palette-filter" class="filter-select">
                        <option value="all">All (50)</option>
                        <option value="answered">Answered</option>
                        <option value="unanswered">Unanswered</option>
                        <option value="bookmarked">Bookmarked</option>
                    </select>
                </div>

                <div class="palette-grid" id="palette-grid">
                    <!-- Grid Buttons generated dynamically -->
                </div>

                <div class="legend" id="legend-container">
                    <div class="legend-item"><div class="legend-color" style="background:var(--accent-primary)"></div> Answered</div>
                    <div class="legend-item"><div class="legend-color" style="background:var(--bg-primary); border:1px solid var(--border-color)"></div> Unanswered</div>
                    <div class="legend-item"><div class="legend-color" style="outline:2px solid var(--accent-primary)"></div> Current</div>
                    <div class="legend-item"><span style="color:var(--warning)">★</span> Bookmarked</div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Score Card Modal -->
    <div class="modal-overlay" id="score-modal">
        <div class="modal-card fade-in">
            <h2>Quiz Results</h2>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">Right to Information Act, 2005</p>

            <div class="score-circle">
                <span class="score-value" id="modal-score">0</span>
                <span class="score-total">out of 50</span>
            </div>

            <p id="pass-fail-badge" style="font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem;"></p>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="stat-percentage" style="color: var(--accent-primary);">0%</div>
                    <div class="stat-lbl">Percentage</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-correct" style="color: var(--success);">0</div>
                    <div class="stat-lbl">Correct</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-incorrect" style="color: var(--danger);">0</div>
                    <div class="stat-lbl">Incorrect</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-skipped" style="color: var(--text-muted);">0</div>
                    <div class="stat-lbl">Skipped</div>
                </div>
            </div>

            <button class="btn btn-primary" id="review-btn" style="width: 100%;">Review Detailed Answers</button>
        </div>
    </div>

    <script>
        // --- 50 MCQs DATA POOL FOR RIGHT TO INFORMATION ACT, 2005 ---
        const originalQuestions = [
            {
                id: 1,
                question: "When did the Right to Information Act, 2005 receive the assent of the President of India?",
                options: [
                    "15th June 2005",
                    "12th October 2005",
                    "2nd October 2005",
                    "26th January 2005"
                ],
                answer: "15th June 2005",
                explanation: "Section 1: The RTI Act received the assent of the President of India on 15th June 2005 and came into full force on 12th October 2005 (120th day of its enactment)."
            },
            {
                id: 2,
                question: "Under Section 7(1) of the RTI Act, 2005, what is the mandatory timeframe for providing information if it concerns the life or liberty of a person?",
                options: [
                    "24 hours",
                    "48 hours",
                    "7 days",
                    "30 days"
                ],
                answer: "48 hours",
                explanation: "Proviso to Section 7(1): Where the information sought for concerns the life or liberty of a person, the same shall be provided within forty-eight hours of the receipt of the request."
            },
            {
                id: 3,
                question: "What is the maximum penalty that can be imposed on a CPIO under Section 20(1) for unreasonably delaying or denying information?",
                options: [
                    "₹10,000",
                    "₹25,000",
                    "₹50,000",
                    "₹1,000"
                ],
                answer: "₹25,000",
                explanation: "Section 20(1): The Information Commission shall impose a penalty of ₹250 each day till application is received or information is furnished, subject to a maximum total penalty of ₹25,000."
            },
            {
                id: 4,
                question: "As per Section 20(1), what is the per-day rate of penalty for delay in furnishing information without reasonable cause?",
                options: [
                    "₹100 per day",
                    "₹250 per day",
                    "₹500 per day",
                    "₹1,000 per day"
                ],
                answer: "₹250 per day",
                explanation: "Section 20(1): Penalty is calculated at the rate of ₹250 per day for each day's delay until the information is provided, not exceeding ₹25,000."
            },
            {
                id: 5,
                question: "Under Section 6(1), who among the following is entitled to file an application for obtaining information under the RTI Act?",
                options: [
                    "Any person residing in South Asia",
                    "Only Indian Citizens",
                    "Foreign Diplomats and NRIs only",
                    "Registered Private Corporations"
                ],
                answer: "Only Indian Citizens",
                explanation: "Section 3 & Section 6(1): Subject to the provisions of the Act, all 'citizens' shall have the right to information. Corporations or foreigners cannot file RTI applications as citizens."
            },
            {
                id: 6,
                question: "Which Section of the RTI Act, 2005 deals with exemptions from disclosure of information?",
                options: [
                    "Section 6",
                    "Section 8",
                    "Section 11",
                    "Section 19"
                ],
                answer: "Section 8",
                explanation: "Section 8(1) outlines various grounds under which public authorities are exempted from disclosing specific categories of information."
            },
            {
                id: 7,
                question: "Under Section 11(1), within how many days must a Third Party submit written representation after receiving notice from the CPIO?",
                options: [
                    "5 days",
                    "10 days",
                    "15 days",
                    "30 days"
                ],
                answer: "10 days",
                explanation: "Section 11(1): The third party shall, within ten days from the date of receipt of notice, be given the opportunity to make oral or written representation against proposed disclosure."

        /**
         * Fisher-Yates Shuffle Algorithm for Array
         */
        function fisherYatesShuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

            if (bookmarked[idx]) {
                bookmarkBtn.classList.add('active');
                bookmarkIcon.textContent = '★';
            } else {
                bookmarkBtn.classList.remove('active');
                bookmarkIcon.textContent = '☆';
            }

            // Options Rendering
            optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            q.options.forEach((optText, optIdx) => {
                const optEl = document.createElement('div');
                optEl.className = 'option-item';

                const isSelected = userAnswers[idx] === optText;
                if (isSelected) {
                    optEl.classList.add('selected');
                }

                // Review Mode Styles
                if (isSubmitted) {
                    if (optText === q.answer) {
                        optEl.classList.add('correct');
                    }
                    if (isSelected && optText !== q.answer) {
                        optEl.classList.add('wrong');
                    }
                }

                optEl.innerHTML = `
                    <div class="option-prefix">${labels[optIdx]}</div>
                    <div style="flex:1;">${optText}</div>
                `;

                if (!isSubmitted) {
                    optEl.addEventListener('click', () => selectOption(optText));
                }

                optionsContainer.appendChild(optEl);
            });

            // Explanation Display in Review Mode
            if (isSubmitted) {
                explanationContainer.style.display = 'block';
                explanationContainer.className = 'explanation-box';
                explanationContainer.innerHTML = `
                    <strong>Statutory Reference & Legal Explanation:</strong>
                    ${q.explanation}
                `;
            } else {
                explanationContainer.style.display = 'none';
            }

            // Nav Controls Update
            prevBtn.disabled = idx === 0;
            nextBtn.disabled = idx === questions.length - 1;

            updatePaletteCurrent();
        }

        function selectOption(optText) {
            userAnswers[currentIdx] = optText;
            loadQuestion(currentIdx);
            renderPalette();
        }

        function clearSelection() {
            if (isSubmitted) return;
            userAnswers[currentIdx] = null;
            loadQuestion(currentIdx);
            renderPalette();
        }

        function toggleBookmark() {
            bookmarked[currentIdx] = !bookmarked[currentIdx];
            loadQuestion(currentIdx);
            renderPalette();
        }

        function renderPalette() {
            paletteGrid.innerHTML = '';
            const filter = paletteFilter.value;

            questions.forEach((q, idx) => {
                const isAnswered = userAnswers[idx] !== null;
                const isBookmarked = bookmarked[idx];

                // Filter Evaluation
                if (filter === 'answered' && !isAnswered) return;
                if (filter === 'unanswered' && isAnswered) return;
                if (filter === 'bookmarked' && !isBookmarked) return;

                const item = document.createElement('button');
                item.className = 'palette-item';
                item.textContent = idx + 1;

                if (idx === currentIdx) {
                    item.classList.add('current');
                }

                if (!isSubmitted) {
                    if (isAnswered) item.classList.add('answered');
                } else {
                    // Post-submission palette coloring
                    if (userAnswers[idx] === q.answer) {
                        item.classList.add('status-correct');
                    } else if (userAnswers[idx] !== null) {
                        item.classList.add('status-wrong');
                    } else {
                        item.classList.add('status-unattempted');
                    }
                }

                if (isBookmarked) item.classList.add('bookmarked');

                item.addEventListener('click', () => loadQuestion(idx));
                paletteGrid.appendChild(item);
            });
        }

        function updatePaletteCurrent() {
            const items = paletteGrid.querySelectorAll('.palette-item');
            items.forEach(item => {
                if (parseInt(item.textContent) === currentIdx + 1) {
                    item.classList.add('current');
                } else {
                    item.classList.remove('current');
                }
            });
        }

        function autoSubmitQuiz() {
            showBanner("Time expired! Your answers have been submitted automatically.", "info");
            finalizeQuiz();
        }

        function submitQuiz() {
            const unansweredCount = userAnswers.filter(a => a === null).length;
            let msg = "Are you sure you want to submit your quiz?";
            if (unansweredCount > 0) {
                msg = `You have ${unansweredCount} unanswered question(s). Are you sure you want to submit?`;
            }
            if (confirm(msg)) {
                finalizeQuiz();
            }
        }

        function finalizeQuiz() {
            isSubmitted = true;
            clearInterval(timerInterval);

            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let skippedCount = 0;

            questions.forEach((q, idx) => {
                const ans = userAnswers[idx];
                if (ans === q.answer) {
                    score++;
                    correctCount++;
                } else if (ans !== null) {
                    incorrectCount++;
                } else {
                    skippedCount++;
                }
            });

            const percentage = ((score / questions.length) * 100).toFixed(1);

            // Populate Modal Stats
            document.getElementById('modal-score').textContent = score;
            document.getElementById('stat-percentage').textContent = `${percentage}%`;
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-incorrect').textContent = incorrectCount;
            document.getElementById('stat-skipped').textContent = skippedCount;

            const badge = document.getElementById('pass-fail-badge');
            if (percentage >= 75) {
                badge.textContent = "EXCELLENT PERFORMANCE";
                badge.style.color = "var(--success)";
            } else if (percentage >= 50) {
                badge.textContent = "PASSED";
                badge.style.color = "var(--accent-primary)";
            } else {
                badge.textContent = "NEEDS IMPROVEMENT";
                badge.style.color = "var(--danger)";
            }

            // Display Results Modal
            scoreModal.classList.add('active');

            // Hide action controls and show submission banner
            submitBtn.style.display = 'none';
            clearBtn.style.display = 'none';
            timerDisplay.textContent = 'Completed';

            // Review Legend Mode
            document.getElementById('legend-container').innerHTML = `
                <div class="legend-item"><div class="legend-color" style="background:var(--success)"></div> Correct</div>
                <div class="legend-item"><div class="legend-color" style="background:var(--danger)"></div> Incorrect</div>
                <div class="legend-item"><div class="legend-color" style="background:var(--bg-primary); border:1px solid var(--border-color)"></div> Unattempted</div>
            `;

            renderPalette();
            loadQuestion(currentIdx);
        }

        function showBanner(text, type) {
            statusBanner.textContent = text;
            statusBanner.className = `alert-banner ${type}`;
            statusBanner.style.display = 'block';
        }

        function setupEventListeners() {
            prevBtn.addEventListener('click', () => {
                if (currentIdx > 0) loadQuestion(currentIdx - 1);
            });

            nextBtn.addEventListener('click', () => {
                if (currentIdx < questions.length - 1) loadQuestion(currentIdx + 1);
            });

            clearBtn.addEventListener('click', clearSelection);
            bookmarkBtn.addEventListener('click', toggleBookmark);
            submitBtn.addEventListener('click', submitQuiz);

            restartBtn.addEventListener('click', () => {
                if (confirm("Reshuffling will randomize all questions and options, resetting your current progress and timer. Continue?")) {
                    initQuizApp();
                }
            });

            paletteFilter.addEventListener('change', renderPalette);

            reviewBtn.addEventListener('click', () => {
                scoreModal.classList.remove('active');
                showBanner("Review Mode Active: Examine options and section explanations below each question card.", "info");
            });

            // Theme Switcher Logic
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    document.documentElement.removeAttribute('data-theme');
                    themeToggle.textContent = '🌙';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeToggle.textContent = '☀️';
                }
            });
        }
    </script>
</body>
</html>
