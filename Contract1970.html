<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Labour (Regulation & Abolition) Act, 1970 Master Quiz - 75 Questions</title>
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary-color: #d97706;
      --primary-hover: #b45309;
      --secondary-bg: #f3f4f6;
      --success-color: #059669;
      --success-bg: #d1fae5;
      --danger-color: #dc2626;
      --danger-bg: #fee2e2;
      --warning-color: #d97706;
      --warning-bg: #fef3c7;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --palette-unvisited: #e5e7eb;
      --palette-unvisited-text: #374151;
      --palette-answered: #d97706;
      --palette-answered-text: #ffffff;
    }

    body.dark-mode {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary-color: #f59e0b;
      --primary-hover: #fbbf24;
      --secondary-bg: #334155;
      --success-color: #10b981;
      --success-bg: #064e3b;
      --danger-color: #f87171;
      --danger-bg: #7f1d1d;
      --warning-color: #fbbf24;
      --warning-bg: #78350f;
      --palette-unvisited: #334155;
      --palette-unvisited-text: #cbd5e1;
      --palette-answered: #f59e0b;
      --palette-answered-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .header-titles h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .header-titles p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .timer-badge {
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      background-color: var(--secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .timer-badge.warning {
      background-color: var(--danger-bg);
      color: var(--danger-color);
      border-color: var(--danger-color);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.7; }
    }

    .btn {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--secondary-bg);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      filter: brightness(0.95);
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    .btn-danger:hover {
      filter: brightness(0.9);
    }

    /* Main Container Grid */
    .container {
      max-width: 1280px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      flex: 1;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Question Card */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .question-index {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .bookmark-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .bookmark-btn.active {
      color: var(--warning-color);
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    /* Options List */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .option-card {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      background-color: var(--bg-card);
    }

    .option-card:hover {
      border-color: var(--primary-color);
      background-color: var(--secondary-bg);
    }

    .option-card.selected {
      border-color: var(--primary-color);
      background-color: var(--secondary-bg);
      box-shadow: 0 0 0 1px var(--primary-color);
    }

    .option-card.correct-review {
      border-color: var(--success-color);
      background-color: var(--success-bg);
      color: var(--text-main);
    }

    .option-card.incorrect-review {
      border-color: var(--danger-color);
      background-color: var(--danger-bg);
      color: var(--text-main);
    }

    .radio-custom {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border-color);
      border-radius: 50%;
      margin-top: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-card.selected .radio-custom {
      border-color: var(--primary-color);
    }

    .option-card.selected .radio-custom::after {
      content: "";
      width: 10px;
      height: 10px;
      background-color: var(--primary-color);
      border-radius: 50%;
    }

    .option-label {
      font-size: 0.95rem;
      line-height: 1.4;
      flex: 1;
    }

    /* Bottom Action Bar */
    .card-actions {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .action-group {
      display: flex;
      gap: 0.5rem;
    }

    /* Explanation Box */
    .explanation-box {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      background-color: var(--secondary-bg);
      border-left: 4px solid var(--primary-color);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .explanation-title {
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--primary-color);
    }

    /* Sidebar / Palette */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .filter-tabs {
      display: flex;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background-color: var(--bg-card);
    }

    .tab-btn {
      flex: 1;
      padding: 0.5rem 0.2rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      max-height: 400px;
      overflow-y: auto;
      padding: 0.25rem;
    }

    .palette-item {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      background-color: var(--palette-unvisited);
      color: var(--palette-unvisited-text);
      position: relative;
      transition: all 0.2s;
    }

    .palette-item.active-current {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }

    .palette-item.answered {
      background-color: var(--palette-answered);
      color: var(--palette-answered-text);
      border-color: var(--palette-answered);
    }

    .palette-item.bookmarked::after {
      content: "★";
      position: absolute;
      top: 1px;
      right: 3px;
      font-size: 0.65rem;
      color: var(--warning-color);
    }

    .palette-item.correct-post {
      background-color: var(--success-color);
      color: #ffffff;
      border-color: var(--success-color);
    }

    .palette-item.incorrect-post {
      background-color: var(--danger-color);
      color: #ffffff;
      border-color: var(--danger-color);
    }

    .legend-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--bg-card);
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      padding: 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .modal-score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-color);
      margin: 1rem 0;
    }

    .performance-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .badge-excellent { background-color: var(--success-bg); color: var(--success-color); }
    .badge-passed { background-color: var(--warning-bg); color: var(--warning-color); }
    .badge-failed { background-color: var(--danger-bg); color: var(--danger-color); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      text-align: left;
      font-size: 0.9rem;
    }

    .summary-item {
      padding: 0.5rem;
      background-color: var(--secondary-bg);
      border-radius: 4px;
    }

    .summary-item span {
      font-weight: 700;
      float: right;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-titles">
      <h1>Contract Labour (Regulation & Abolition) Act, 1970</h1>
      <p>Interactive Statutory Assessment Engine - 75 Comprehensive Questions</p>
    </div>
    <div class="header-controls">
      <div id="timerDisplay" class="timer-badge">45:00</div>
      <button id="restartBtn" class="btn btn-secondary" title="Reshuffle & Restart">🔄 Restart</button>
      <button id="themeToggleBtn" class="btn btn-secondary" title="Toggle Light/Dark Mode">🌙</button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="container">
    <!-- Left Column: Active Question -->
    <main class="card">
      <div class="question-header">
        <span id="questionIndexDisplay" class="question-index">Question 1 of 75</span>
        <button id="bookmarkToggleBtn" class="bookmark-btn" title="Bookmark Question">★</button>
      </div>
      <div id="questionTextDisplay" class="question-text">Loading question...</div>
      
      <div id="optionsContainer" class="options-list"></div>

      <div id="explanationContainer"></div>

      <div class="card-actions">
        <div class="action-group">
          <button id="prevBtn" class="btn btn-secondary">Previous</button>
          <button id="nextBtn" class="btn btn-secondary">Next</button>
        </div>
        <div class="action-group">
          <button id="clearBtn" class="btn btn-secondary">Clear Selection</button>
          <button id="submitBtn" class="btn btn-danger">Submit Quiz</button>
        </div>
      </div>
    </main>

    <!-- Right Column: Palette & Filters -->
    <aside class="sidebar">
      <div class="card">
        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">All</button>
          <button class="tab-btn" data-filter="answered">Answered</button>
          <button class="tab-btn" data-filter="unanswered">Unanswered</button>
          <button class="tab-btn" data-filter="bookmarked">Bookmarked</button>
        </div>
        <div id="paletteGrid" class="palette-grid" style="margin-top: 1rem;"></div>
        <div class="legend-box">
          <div class="legend-item"><div class="legend-color" style="background: var(--palette-unvisited);"></div> Unanswered</div>
          <div class="legend-item"><div class="legend-color" style="background: var(--palette-answered);"></div> Answered</div>
          <div class="legend-item"><div class="legend-color" style="background: var(--success-color);"></div> Correct</div>
          <div class="legend-item"><div class="legend-color" style="background: var(--danger-color);"></div> Incorrect</div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Results Modal -->
  <div id="resultsModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Assessment Complete</h2>
      <div id="modalScoreDisplay" class="modal-score">0 / 75</div>
      <div id="modalBadge" class="performance-badge">Passed</div>
      
      <div class="summary-grid">
        <div class="summary-item">Total Answered <span id="summaryAnswered">0</span></div>
        <div class="summary-item">Correct <span id="summaryCorrect">0</span></div>
        <div class="summary-item">Incorrect <span id="summaryIncorrect">0</span></div>
        <div class="summary-item">Skipped <span id="summarySkipped">0</span></div>
      </div>

      <div style="display: flex; gap: 0.5rem; justify-content: center;">
        <button id="reviewModeBtn" class="btn btn-primary">Review Detailed Answers</button>
        <button id="modalRestartBtn" class="btn btn-secondary">Restart Quiz</button>
      </div>
    </div>
  </div>

  <script>
    // 75 High-Quality Questions on Contract Labour (Regulation & Abolition) Act, 1970
    const rawQuestionsData = [
      {
        id: 1,
        question: "When did the Contract Labour (Regulation and Abolition) Act, 1970 receive Presidential assent and come into force?",
        options: ["Assent on 5th September 1970; Enforced on 10th February 1971", "Assent on 26th January 1970; Enforced on 1st May 1970", "Assent on 15th August 1971; Enforced on 2nd October 1971", "Assent on 31st December 1970; Enforced on 1st April 1972"],
        correctIndex: 0,
        explanation: "The Act received the assent of the President on 5th September 1970 and came into force on 10th February 1971."
      },
      {
        id: 2,
        question: "Under Section 1(4)(a), the Act applies to every establishment in which how many workmen are employed or were employed on any day of the preceding twelve months as contract labour?",
        options: ["10 or more workmen", "20 or more workmen (or higher as notified by State)", "50 or more workmen", "100 or more workmen"],
        correctIndex: 1,
        explanation: "Section 1(4)(a) applies to every establishment in which twenty or more workmen are employed or were employed on any day of the preceding twelve months as contract labour."
      },
      {
        id: 3,
        question: "Under Section 1(4)(b), the Act applies to every contractor who employs or employed how many workmen on any day of the preceding twelve months?",
        options: ["5 or more", "10 or more", "20 or more workmen (or threshold modified by appropriate Govt)", "50 or more"],
        correctIndex: 2,
        explanation: "Section 1(4)(b) applies to every contractor who employs or who employed on any day of the preceding twelve months twenty or more workmen."
      },
      {
        id: 4,
        question: "Under Section 1(5), the Act does NOT apply to establishments in which work is performed of what nature?",
        options: ["Permanent manufacturing work", "Intermittent or casual nature", "Hazardous nature", "Export-oriented work"],
        correctIndex: 1,
        explanation: "Section 1(5)(a) specifies that the Act shall not apply to establishments in which work only of an intermittent or casual nature is performed."
      },
      {
        id: 5,
        question: "Under Section 1(5) Explanation, work performed in an establishment shall NOT be deemed intermittent if it is performed for more than how many days in preceding 12 months?",
        options: ["60 days", "90 days", "120 days", "180 days"],
        correctIndex: 2,
        explanation: "Under Section 1(5) Explanation (a), work shall not be deemed intermittent if performed for more than 120 days in the preceding twelve months."
      },
      {
        id: 6,
        question: "Under Section 1(5) Explanation (b), work of a seasonal character performed in an establishment shall NOT be deemed intermittent if performed for more than how many days per year?",
        options: ["30 days", "45 days", "60 days", "90 days"],
        correctIndex: 2,
        explanation: "Section 1(5) Explanation (b) states work of seasonal character is not deemed intermittent if performed for more than sixty days in a year."
      },
      {
        id: 7,
        question: "Under Section 2(1)(a), if any question arises whether work performed in an establishment is of an intermittent or casual nature, who decides the question?",
        options: ["The High Court of the State", "The Appropriate Government after consultation with the Central/State Board", "The District Magistrate", "The Chief Labour Commissioner"],
        correctIndex: 1,
        explanation: "Section 1(5) proviso mandates that if a question arises whether work is of an intermittent or casual nature, the appropriate Government shall decide after consulting the Board."
      },
      {
        id: 8,
        question: "Under Section 2(1)(a), what is the 'Appropriate Government' in relation to any establishment carried on by or under the authority of the Central Government, Railways, Mines, Oilfields, or Major Ports?",
        options: ["The State Government where situated", "The Central Government", "The Municipal Corporation", "The High Court"],
        correctIndex: 1,
        explanation: "Section 2(1)(a)(i) specifies that Central Government is the appropriate Government for establishments under Central Govt, railways, mines, oilfields, major ports, controlled corporations, etc."
      },
      {
        id: 9,
        question: "Under Section 2(1)(b), a workman is deemed to be employed as 'contract labour' when he is hired in or in connection with such work by or through:",
        options: ["A direct employment exchange", "A contractor, with or without the knowledge of the principal employer", "A trade union leader", "A government sub-registrar"],
        correctIndex: 1,
        explanation: "Section 2(1)(b) states a workman shall be deemed to be employed as contract labour when he is hired by or through a contractor, with or without the knowledge of the principal employer."
      },
      {
        id: 10,
        question: "Under Section 2(1)(c), who is defined as a 'contractor'?",
        options: ["A person who undertakes to produce a given result for the establishment (other than mere supply of goods/articles) or who supplies contract labour", "Any person supplying raw materials to a factory", "A manager appointed directly by the board of directors", "An independent sub-agent selling finished goods"],
        correctIndex: 0,
        explanation: "Section 2(1)(c) defines 'contractor' as a person who undertakes to produce a given result for the establishment through contract labour, or who supplies contract labour."
      },
      {
        id: 11,
        question: "Under Section 2(1)(c), does a contractor include a sub-contractor?",
        options: ["No, sub-contractors are excluded from the Act", "Yes, contractor explicitly includes a sub-contractor", "Only if registered separately with the Police", "Only in public sector undertakings"],
        correctIndex: 1,
        explanation: "Section 2(1)(c) explicitly states that the term 'contractor' includes a sub-contractor."
      },
      {
        id: 12,
        question: "Under Section 2(1)(e), in relation to a factory, who is the 'principal employer'?",
        options: ["The Chief Inspector of Factories", "The owner or occupier of the factory, including a manager named under the Factories Act, 1948", "The contractor supplying maximum labour", "The local Labour Commissioner"],
        correctIndex: 1,
        explanation: "Section 2(1)(e)(i) defines principal employer in a factory as the owner or occupier, including a person named as manager under Section 7(1)(f) of the Factories Act, 1948."
      },
      {
        id: 13,
        question: "Under Section 2(1)(e)(ii), in a mine, who is the 'principal employer'?",
        options: ["The Director General of Mines Safety", "The owner or agent of the mine and the manager of the mine", "The contractor holding a mining lease", "The district collector"],
        correctIndex: 1,
        explanation: "In a mine, principal employer means the owner or agent of the mine and the manager of the mine."
      },
      {
        id: 14,
        question: "Under Section 2(1)(e)(iii), in any other establishment, who is the 'principal employer'?",
        options: ["Any person responsible for the supervision and control of the establishment", "The head clerk of accounts", "The security agency chief", "The trade union president"],
        correctIndex: 0,
        explanation: "Section 2(1)(e)(iii) defines principal employer in any other establishment as any person responsible for the supervision and control of the establishment."
      },
      {
        id: 15,
        question: "Under Section 2(1)(i), which of the following is EXCLUDED from the definition of 'workman' under the Act?",
        options: ["Unskilled manual workers", "Persons employed mainly in a managerial or administrative capacity", "Skilled technical staff doing manual operation", "Clerical staff"],
        correctIndex: 1,
        explanation: "Section 2(1)(i)(A) excludes persons who are employed mainly in a managerial or administrative capacity from the definition of workman."
      },
      {
        id: 16,
        question: "Under Section 2(1)(i)(B), a person employed in a supervisory capacity is EXCLUDED from 'workman' if his wages exceed per mensem or his functions are managerial:",
        options: ["Rs. 500 per month (as originally enacted/prescribed)", "Rs. 10,000 per month", "Rs. 15,000 per month", "Rs. 21,000 per month"],
        correctIndex: 0,
        explanation: "Section 2(1)(i)(B) excludes a person employed in a supervisory capacity drawing wages exceeding five hundred rupees per mensem (or as amended/prescribed) or exercising managerial functions."
      },
      {
        id: 17,
        question: "Under Section 3(1), who constitutes the Central Advisory Contract Labour Board?",

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resultsModal = document.getElementById('resultsModal');

    // Fisher-Yates Shuffle Algorithm
    function fisherYatesShuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Initialize/Reset Quiz Data Engine
    function initQuizData() {
      // Deep copy and shuffle questions
      shuffledQuestions = fisherYatesShuffle(rawQuestionsData).map(q => {
        // Prepare options array with original indices tracked
        const optionsObj = q.options.map((optText, index) => ({
          text: optText,
          originalIndex: index
        }));
        
        // Shuffle options
        const shuffledOptions = fisherYatesShuffle(optionsObj);
        
        // Find new correct index
        const newCorrectIndex = shuffledOptions.findIndex(o => o.originalIndex === q.correctIndex);

        return {
          id: q.id,
          question: q.question,
          options: shuffledOptions,
          correctIndex: newCorrectIndex,
          explanation: q.explanation
        };
      });

      // Reset runtime state
      currentQuestionIndex = 0;
      userAnswers = {};
      bookmarks.clear();
      isSubmitted = false;
      activeFilter = 'all';

      // Reset Timer
      clearInterval(timerInterval);
      timeRemaining = TOTAL_TIME_SECONDS;
      updateTimerUI();
      startTimer();

      // Reset UI Controls
      submitBtn.disabled = false;
      clearBtn.disabled = false;
      resultsModal.classList.remove('open');

      renderFilterTabs();
      renderCurrentQuestion();
      renderPalette();
    }

    // Timer Logic
    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerUI();

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          autoSubmitQuiz();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      timerDisplay.textContent = formatted;

      if (timeRemaining < 300) { // < 5 mins
        timerDisplay.classList.add('warning');
      } else {
        timerDisplay.classList.remove('warning');
      }
    }

    // Render Question Card
    function renderCurrentQuestion() {
      const q = shuffledQuestions[currentQuestionIndex];
      
      questionIndexDisplay.textContent = `Question ${currentQuestionIndex + 1} of ${shuffledQuestions.length}`;
      questionTextDisplay.textContent = q.question;

      // Bookmark state
      if (bookmarks.has(currentQuestionIndex)) {
        bookmarkToggleBtn.classList.add('active');
      } else {
        bookmarkToggleBtn.classList.remove('active');
      }

      // Render Options
      optionsContainer.innerHTML = '';
      const selectedOption = userAnswers[currentQuestionIndex];

      q.options.forEach((opt, idx) => {
        const optionCard = document.createElement('div');
        optionCard.className = 'option-card';

        // Apply review styling if submitted
        if (isSubmitted) {
          if (idx === q.correctIndex) {
            optionCard.classList.add('correct-review');
          } else if (selectedOption === idx && selectedOption !== q.correctIndex) {
            optionCard.classList.add('incorrect-review');
          }
        } else if (selectedOption === idx) {
          optionCard.classList.add('selected');
        }

        optionCard.innerHTML = `
          <div class="radio-custom"></div>
          <div class="option-label">${opt.text}</div>
        `;

        if (!isSubmitted) {
          optionCard.addEventListener('click', () => selectOption(idx));
        }

        optionsContainer.appendChild(optionCard);
      });

      // Render Explanation in Review Mode
      explanationContainer.innerHTML = '';
      if (isSubmitted) {
        const expBox = document.createElement('div');
        expBox.className = 'explanation-box';
        expBox.innerHTML = `
          <div class="explanation-title">Statutory Clause & Reference:</div>
          <div>${q.explanation}</div>
        `;
        explanationContainer.appendChild(expBox);
      }

      // Update Navigation Buttons
      prevBtn.disabled = currentQuestionIndex === 0;
      nextBtn.disabled = currentQuestionIndex === shuffledQuestions.length - 1;

      renderPalette();
    }

    // Select Option
    function selectOption(optionIndex) {
      if (isSubmitted) return;
      userAnswers[currentQuestionIndex] = optionIndex;
      renderCurrentQuestion();
    }

    // Clear Selection
    clearBtn.addEventListener('click', () => {
      if (isSubmitted) return;
      delete userAnswers[currentQuestionIndex];
      renderCurrentQuestion();
    });

    // Bookmark Toggle
    bookmarkToggleBtn.addEventListener('click', () => {
      if (bookmarks.has(currentQuestionIndex)) {
        bookmarks.delete(currentQuestionIndex);
      } else {
        bookmarks.add(currentQuestionIndex);
      }
      renderCurrentQuestion();
    });

    // Navigation Events
    prevBtn.addEventListener('click', () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderCurrentQuestion();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentQuestionIndex < shuffledQuestions.length - 1) {
        currentQuestionIndex++;
        renderCurrentQuestion();
      }
    });

    // Palette Rendering & Filter Logic
    function renderPalette() {
      paletteGrid.innerHTML = '';

      shuffledQuestions.forEach((q, idx) => {
        const isAnswered = userAnswers.hasOwnProperty(idx);
        const isBookmarked = bookmarks.has(idx);

        // Filter Evaluation
        if (activeFilter === 'answered' && !isAnswered) return;
        if (activeFilter === 'unanswered' && isAnswered) return;
        if (activeFilter === 'bookmarked' && !isBookmarked) return;

        const item = document.createElement('div');
        item.className = 'palette-item';
        item.textContent = idx + 1;

        if (idx === currentQuestionIndex) {
          item.classList.add('active-current');
        }

        if (isBookmarked) {
          item.classList.add('bookmarked');
        }

        if (isSubmitted) {
          const userAns = userAnswers[idx];
          if (userAns === q.correctIndex) {
            item.classList.add('correct-post');
          } else if (userAns !== undefined) {
            item.classList.add('incorrect-post');
          }
        } else if (isAnswered) {
          item.classList.add('answered');
        }

        item.addEventListener('click', () => {
          currentQuestionIndex = idx;
          renderCurrentQuestion();
        });

        paletteGrid.appendChild(item);
      });
    }

    // Filter Tab Buttons
    function renderFilterTabs() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
          tabs.forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          activeFilter = e.target.getAttribute('data-filter');
          renderPalette();
        });
      });
    }

    // Submit Quiz & Show Results
    function submitQuiz() {
      if (isSubmitted) return;
      isSubmitted = true;
      clearInterval(timerInterval);

      // Score Calculation
      let correctCount = 0;
      let incorrectCount = 0;
      let answeredCount = 0;

      shuffledQuestions.forEach((q, idx) => {
        if (userAnswers.hasOwnProperty(idx)) {
          answeredCount++;
          if (userAnswers[idx] === q.correctIndex) {
            correctCount++;
          } else {
            incorrectCount++;
          }
        }
      });

      const totalCount = shuffledQuestions.length;
      const skippedCount = totalCount - answeredCount;
      const percentage = Math.round((correctCount / totalCount) * 100);

      // Modal Elements
      document.getElementById('modalScoreDisplay').textContent = `${correctCount} / ${totalCount} (${percentage}%)`;
      document.getElementById('summaryAnswered').textContent = answeredCount;
      document.getElementById('summaryCorrect').textContent = correctCount;
      document.getElementById('summaryIncorrect').textContent = incorrectCount;
      document.getElementById('summarySkipped').textContent = skippedCount;

      const badge = document.getElementById('modalBadge');
      if (percentage >= 80) {
        badge.textContent = "Excellent";
        badge.className = "performance-badge badge-excellent";
      } else if (percentage >= 50) {
        badge.textContent = "Passed";
        badge.className = "performance-badge badge-passed";
      } else {
        badge.textContent = "Failed";
        badge.className = "performance-badge badge-failed";
      }

      resultsModal.classList.add('open');
      renderCurrentQuestion();
    }

    function autoSubmitQuiz() {
      alert("Time has expired! Automatically submitting your quiz.");
      submitQuiz();
    }

    submitBtn.addEventListener('click', () => {
      if (confirm("Are you sure you want to submit your quiz?")) {
        submitQuiz();
      }
    });

    // Review & Restart Handlers
    document.getElementById('reviewModeBtn').addEventListener('click', () => {
      resultsModal.classList.remove('open');
    });

    document.getElementById('modalRestartBtn').addEventListener('click', () => {
      initQuizData();
    });

    restartBtn.addEventListener('click', () => {
      if (confirm("Restarting will shuffle all questions and clear active progress. Proceed?")) {
        initQuizData();
      }
    });

    // Dark/Light Theme Switcher
    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      if (document.body.classList.contains('dark-mode')) {
        themeToggleBtn.textContent = '☀️';
      } else {
        themeToggleBtn.textContent = '🌙';
      }
    });

    // Initialize Engine On Load
    window.addEventListener('DOMContentLoaded', () => {
      initQuizData();
    });
  </script>
</body>
</html>
