<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Government Accounts (Receipts & Payments) Rules, 2022 - Interactive Quiz</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --warning: #d97706;
            --warning-light: #fffbeb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-full: 9999px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #334155;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: #1e3a8a;
            --success: #22c55e;
            --success-light: #14532d;
            --danger: #ef4444;
            --danger-light: #7f1d1d;
            --warning: #f59e0b;
            --warning-light: #78350f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-title h1 {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .badge {
            background-color: var(--accent-light);
            color: var(--accent-primary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Timer Widget */
        .timer-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--accent-light);
            color: var(--accent-primary);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            font-family: monospace;
            border: 1px solid var(--border-color);
        }

        .timer-box.warning {
            background-color: var(--warning-light);
            color: var(--warning);
            animation: pulse 1s infinite;
        }

        .timer-box.danger {
            background-color: var(--danger-light);
            color: var(--danger);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Buttons & Actions */
        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .icon-btn:hover {
            background-color: var(--border-color);
        }

        /* Layout */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.5rem;
            flex: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Main Question Box */
        .main-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 480px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .question-number {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .bookmark-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 600;
        }

        .bookmark-btn.active {
            color: var(--warning);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            line-height: 1.6;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            background-color: var(--bg-card);
            font-size: 0.95rem;
            color: var(--text-primary);
            position: relative;
        }

        .option-item:hover {
            border-color: var(--accent-primary);
            background-color: var(--accent-light);
        }

        .option-item.selected {
            border-color: var(--accent-primary);
            background-color: var(--accent-light);
            font-weight: 500;
        }

        .option-prefix {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            background-color: var(--bg-primary);
        }

        .option-item.selected .option-prefix {
            background-color: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
        }

        /* Review Mode Option Styles */
        .option-item.correct {
            border-color: var(--success) !important;
            background-color: var(--success-light) !important;
            color: var(--text-primary);
        }

        .option-item.correct .option-prefix {
            background-color: var(--success);
            color: #ffffff;
            border-color: var(--success);
        }

        .option-item.wrong {
            border-color: var(--danger) !important;
            background-color: var(--danger-light) !important;
            color: var(--text-primary);
        }

        .option-item.wrong .option-prefix {
            background-color: var(--danger);
            color: #ffffff;
            border-color: var(--danger);
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 1rem;
            padding: 1rem;
            background-color: var(--accent-light);
            border-left: 4px solid var(--accent-primary);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .explanation-box strong {
            color: var(--text-primary);
            display: block;
            margin-bottom: 0.25rem;
        }

        /* Navigation Bar */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-secondary {
            background-color: var(--bg-primary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Sidebar Palette */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .palette-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-md);
        }

        .palette-header {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-select {
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.8rem;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .palette-item {
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .palette-item:hover {
            border-color: var(--accent-primary);
        }

        .palette-item.current {
            outline: 2px solid var(--accent-primary);
            outline-offset: 1px;
        }

        .palette-item.answered {
            background-color: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
        }

        .palette-item.bookmarked::after {
            content: '★';
            position: absolute;
            top: 1px;
            right: 2px;
            font-size: 0.6rem;
            color: var(--warning);
        }

        /* Review Mode Palette Status */
        .palette-item.status-correct {
            background-color: var(--success) !important;
            color: #ffffff !important;
            border-color: var(--success) !important;
        }

        .palette-item.status-wrong {
            background-color: var(--danger) !important;
            color: #ffffff !important;
            border-color: var(--danger) !important;
        }

        .palette-item.status-unattempted {
            background-color: var(--bg-primary) !important;
            color: var(--text-muted) !important;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .legend-color {
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 2px;
        }

        /* Custom Modal Dialog */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--accent-light);
            color: var(--accent-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            border: 4px solid var(--accent-primary);
        }

        .score-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .score-total {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin: 1.5rem 0;
        }

        .stat-box {
            background-color: var(--bg-primary);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .stat-val {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>CGA Receipts & Payments Rules, 2022</h1>
            <span class="badge">Official Exam Quiz</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="restart-btn" title="Reshuffle & Restart Quiz">
                🔄 Reshuffle & Restart
            </button>
            <div id="timer" class="timer-box">
                ⏱️ <span id="timer-display">30:00</span>
            </div>
            <button class="icon-btn" id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
        </div>
    </header>

    <div class="container">
        <!-- Main Quiz Section -->
        <main class="main-card fade-in" id="main-card">
            <div>
                <div class="question-header">
                    <span class="question-number" id="q-number">Question 1 of 50</span>
                    <button class="bookmark-btn" id="bookmark-btn" title="Bookmark Question">
                        <span id="bookmark-icon">☆</span> Bookmark
                    </button>
                </div>
                
                <div class="question-text" id="q-text">
                    Loading Question...
                </div>

                <div class="options-list" id="options-container">
                    <!-- Dynamic Options -->
                </div>

                <div id="explanation-container" style="display: none;">
                    <!-- Explanation shown post-submission -->
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="nav-controls">
                <div>
                    <button class="btn btn-secondary" id="prev-btn">← Previous</button>
                    <button class="btn btn-secondary" id="clear-btn">Clear Answer</button>
                </div>
                <div>
                    <button class="btn btn-primary" id="next-btn">Next →</button>
                    <button class="btn btn-danger" id="submit-btn">Submit Quiz</button>
                </div>
            </div>
        </main>

        <!-- Sidebar / Palette -->
        <aside class="sidebar">
            <div class="palette-card">
                <div class="palette-header">
                    <span>Question Palette</span>
                    <select id="palette-filter" class="filter-select">
                        <option value="all">All (50)</option>
                        <option value="answered">Answered</option>
                        <option value="unanswered">Unanswered</option>
                        <option value="bookmarked">Bookmarked</option>
                    </select>
                </div>

                <div class="palette-grid" id="palette-grid">
                    <!-- Grid Buttons generated dynamically -->
                </div>

                <div class="legend" id="legend-container">
                    <div class="legend-item"><div class="legend-color" style="background:var(--accent-primary)"></div> Answered</div>
                    <div class="legend-item"><div class="legend-color" style="background:var(--bg-primary); border:1px solid var(--border-color)"></div> Unanswered</div>
                    <div class="legend-item"><div class="legend-color" style="outline:2px solid var(--accent-primary)"></div> Current</div>
                    <div class="legend-item"><span style="color:var(--warning)">★</span> Bookmarked</div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Custom Modal Dialog (Score Card) -->
    <div class="modal-overlay" id="score-modal">
        <div class="modal-card fade-in">
            <h2>Quiz Results</h2>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">Central Government Accounts (R&P) Rules, 2022</p>

            <div class="score-circle">
                <span class="score-value" id="modal-score">0</span>
                <span class="score-total">out of 50</span>
            </div>

            <p id="pass-fail-badge" style="font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem;"></p>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="stat-percentage" style="color: var(--accent-primary);">0%</div>
                    <div class="stat-lbl">Percentage</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-correct" style="color: var(--success);">0</div>
                    <div class="stat-lbl">Correct</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-incorrect" style="color: var(--danger);">0</div>
                    <div class="stat-lbl">Incorrect</div>
                </div>
            </div>

            <button class="btn btn-primary" id="review-btn" style="width: 100%;">Review Answers</button>
        </div>
    </div>

    <script>
        // --- 50 MASTER MCQs ON CENTRAL GOVERNMENT ACCOUNTS (RECEIPTS AND PAYMENTS) RULES, 2022 ---
        const rawQuestions = [
            {
                id: 1,
                question: "Under the Central Government Accounts (Receipts and Payments) Rules, 2022, which entity is primarily responsible for maintaining the detailed accounts of receipts and payments for a Civil Ministry/Department?",
                options: [
                    "Principal Accounts Office (Pr. AO)",
                    "Pay and Accounts Office (PAO)",
                    "Drawing and Disbursing Officer (DDO)",
                    "Controller General of Accounts (CGA)"
                ],
                answer: 1,
                explanation: "Rule 3 & 4 of CGA R&P Rules, 2022: The Pay and Accounts Office (PAO) functions as the primary accounting unit responsible for maintaining detailed receipt and payment accounts of the assigned Department/Ministry."
            },
            {
                id: 2,
                question: "In what form or medium must Government accounts primarily be maintained according to modern accounting standards under R&P Rules, 2022?",
                options: [
                    "Only physical paper ledgers with ink signatures",
                    "Electronic mode through designated IT/PFMS platforms",
                    "Dual physical and cloud storage mode mandatorily",
                    "Microfilm and magnetic tape archives"
                ],
                answer: 1,
                explanation: "Under Rules 5 & 6, payments, receipts, and accounting records are processed and maintained electronically through designated IT systems like Public Financial Management System (PFMS) / e-Payment portals."
            },
            {
                id: 3,
                question: "Which of the following describes the Consolidated Fund of India?",
                options: [
                    "Fund for emergency unfunded contingencies created under Article 267",
                    "Fund containing all revenues received, loans raised, and money received in repayment of loans under Article 266(1)",
                    "Fund holding money received in trust by public servants under Article 266(2)",
                    "Fund managed directly by the Reserve Bank of India without Parliamentary authorization"
                ],
                answer: 1,
                explanation: "Article 266(1) of the Constitution & Rule 2: Consolidated Fund of India includes all revenues received, loans raised by Government, and moneys received in repayment of loans."
            },
            {
                id: 4,
                question: "What is the primary requirement for withdrawing money out of the Consolidated Fund of India?",
                options: [
                    "An executive order issued by the Ministry of Finance",
                    "Appropriation made by law passed by Parliament",
                    "A special warrant issued by the Controller General of Accounts",
                    "Sanction of the Comptroller and Auditor General of India"
                ],
                answer: 1,
                explanation: "Article 266(3) & R&P Rules: No moneys out of the Consolidated Fund of India shall be appropriated except in accordance with law and for the purposes provided in the Constitution."
            },
            {
                id: 5,
                question: "Moneys received by or deposited with any officer of the Central Government other than revenues/loans belong to which account?",
                options: [
                    "Consolidated Fund of India",
                    "Contingency Fund of India",
                    "Public Account of India",
                    "Reserve Bank Account"
                ],
                answer: 2,
                explanation: "Article 266(2) & R&P Rules: All other public moneys received by or on behalf of the Government of India are credited to the Public Account of India."
            },
            {
                id: 6,
                question: "Under whose custody is the Contingency Fund of India held on behalf of the President?",
                options: [
                    "Controller General of Accounts",
                    "Secretary to the Government of India, Ministry of Finance (Department of Economic Affairs)",
                    "Comptroller and Auditor General of India",
                    "Governor of the Reserve Bank of India"
                ],
                answer: 1,
                explanation: "The Contingency Fund of India is held on behalf of the President by the Secretary, Department of Economic Affairs, Ministry of Finance."
            },
            {
                id: 7,
                question: "All government receipts deposited into authorized banks must be remitted to which institution for ultimate settlement?",
                options: [
                    "State Bank of India Main Branch",
                    "Reserve Bank of India (RBI)",
                    "Controller General of Accounts Office",
                    "Ministry of Finance Treasury"
                ],
                answer: 1,
                explanation: "Under R&P Rules, 2022, all collections made by accredited/authorized agent banks must be remitted to the central account of the Reserve Bank of India (RBI)."
            },
            {
                id: 8,
                question: "What is the designated instrument/portal used for digital payment collections and direct revenue deposits by citizens to Central Ministries?",
                options: [
                    "e-Sampark",
                    "Bharatkosh (NTRP)",
                    "GeM Portal",
                    "PFMS Trade Portal"
                ],
                answer: 1,
                explanation: "Bharatkosh (Non-Tax Receipt Portal) is the central portal for online collection of non-tax receipts under the Government of India accounting guidelines."
            },
            {
                id: 9,
                question: "What is a 'Scroll' provided by accredited banks to the Pay and Accounts Office (PAO)?",
                options: [
                    "A list of retired government employees receiving pension",
                    "A daily statement showing transaction details of receipts or payments credited/debited to Government Account",
                    "An annual audit certification submitted to C&AG",

        // DOM Elements
        const mainCard = document.getElementById('main-card');
        const qNumberEl = document.getElementById('q-number');
        const qTextEl = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');

        const scoreModal = document.getElementById('score-modal');
        const reviewBtn = document.getElementById('review-btn');

        // --- SHUFFLE / RANDOMIZATION LOGIC ---
        // Helper Fisher-Yates shuffle array
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Prepares randomized questions and randomized options for each question
        function prepareRandomizedQuestions() {
            // 1. Shuffle main questions
            const shuffled = shuffleArray(rawQuestions);

            // 2. Shuffle options inside each question while mapping correct answer
            return shuffled.map(q => {
                const originalCorrectText = q.options[q.answer];
                const shuffledOptions = shuffleArray(q.options);
                const newAnswerIdx = shuffledOptions.indexOf(originalCorrectText);

                return {
                    id: q.id,
                    question: q.question,
                    options: shuffledOptions,
                    answer: newAnswerIdx,
                    explanation: q.explanation
                };
            });
        }

        // Initialize / Restart Quiz State
        function startNewQuiz() {
            questions = prepareRandomizedQuestions();
            userAnswers = new Array(questions.length).fill(null);
            bookmarked = new Array(questions.length).fill(false);
            isSubmitted = false;
            timeRemaining = 30 * 60;
            currentQuestionIdx = 0;

            // Reset UI components
            submitBtn.style.display = 'inline-flex';
            clearBtn.style.display = 'inline-flex';
            scoreModal.classList.remove('active');

            document.getElementById('legend-container').innerHTML = `
                <div class="legend-item"><div class="legend-color" style="background:var(--accent-primary)"></div> Answered</div>
                <div class="legend-item"><div class="legend-color" style="background:var(--bg-primary); border:1px solid var(--border-color)"></div> Unanswered</div>
                <div class="legend-item"><div class="legend-color" style="outline:2px solid var(--accent-primary)"></div> Current</div>
                <div class="legend-item"><span style="color:var(--warning)">★</span> Bookmarked</div>
            `;

            // Reset Timer
            if (timerInterval) clearInterval(timerInterval);
            initTimer();

            // Render view
            renderPalette();
            loadQuestion(0);
        }

        // Application Start
        window.addEventListener('DOMContentLoaded', () => {
            startNewQuiz();
            setupEventListeners();
        });

        function initTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    autoSubmitQuiz();
                    return;
                }
                timeRemaining--;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            if (timeRemaining <= 300 && timeRemaining > 60) {
                timerBox.className = 'timer-box warning';
            } else if (timeRemaining <= 60) {
                timerBox.className = 'timer-box danger';
            } else {
                timerBox.className = 'timer-box';
            }
        }

        function loadQuestion(idx) {
            currentQuestionIdx = idx;
            const q = questions[idx];

            // Animate card transition
            mainCard.classList.remove('fade-in');
            void mainCard.offsetWidth; // trigger reflow
            mainCard.classList.add('fade-in');

            qNumberEl.textContent = `Question ${idx + 1} of ${questions.length}`;
            qTextEl.textContent = q.question;

            // Bookmark Status
            if (bookmarked[idx]) {
                bookmarkBtn.classList.add('active');
                bookmarkIcon.textContent = '★';
            } else {
                bookmarkBtn.classList.remove('active');
                bookmarkIcon.textContent = '☆';
            }

            // Render Options
            optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, optIdx) => {
                const optEl = document.createElement('div');
                optEl.className = 'option-item';
                
                if (userAnswers[idx] === optIdx) {
                    optEl.classList.add('selected');
                }

                // Review Mode Adjustments
                if (isSubmitted) {
                    if (optIdx === q.answer) {
                        optEl.classList.add('correct');
                    }
                    if (userAnswers[idx] === optIdx && userAnswers[idx] !== q.answer) {
                        optEl.classList.add('wrong');
                    }
                }

                optEl.innerHTML = `
                    <div class="option-prefix">${labels[optIdx]}</div>
                    <div style="flex:1;">${opt}</div>
                `;

                if (!isSubmitted) {
                    optEl.addEventListener('click', () => selectOption(optIdx));
                }

                optionsContainer.appendChild(optEl);
            });

            // Explanation box in review mode
            if (isSubmitted) {
                explanationContainer.style.display = 'block';
                explanationContainer.className = 'explanation-box';
                explanationContainer.innerHTML = `
                    <strong>Explanation / Rule Reference:</strong>
                    ${q.explanation}
                `;
            } else {
                explanationContainer.style.display = 'none';
            }

            // Navigation Buttons State
            prevBtn.disabled = idx === 0;
            nextBtn.disabled = idx === questions.length - 1;

            updatePaletteCurrent();
        }

        function selectOption(optIdx) {
            userAnswers[currentQuestionIdx] = optIdx;
            loadQuestion(currentQuestionIdx);
            renderPalette();
        }

        function clearSelection() {
            if (isSubmitted) return;
            userAnswers[currentQuestionIdx] = null;
            loadQuestion(currentQuestionIdx);
            renderPalette();
        }

        function toggleBookmark() {
            bookmarked[currentQuestionIdx] = !bookmarked[currentQuestionIdx];
            loadQuestion(currentQuestionIdx);
            renderPalette();
        }

        function renderPalette() {
            paletteGrid.innerHTML = '';
            const filter = paletteFilter.value;

            questions.forEach((q, idx) => {
                const isAnswered = userAnswers[idx] !== null;
                const isBookmarked = bookmarked[idx];

                // Filter logic
                if (filter === 'answered' && !isAnswered) return;
                if (filter === 'unanswered' && isAnswered) return;
                if (filter === 'bookmarked' && !isBookmarked) return;

                const item = document.createElement('button');
                item.className = 'palette-item';
                item.textContent = idx + 1;

                if (idx === currentQuestionIdx) {
                    item.classList.add('current');
                }

                if (!isSubmitted) {
                    if (isAnswered) item.classList.add('answered');
                } else {
                    // Review mode palette colors
                    if (userAnswers[idx] === q.answer) {
                        item.classList.add('status-correct');
                    } else if (userAnswers[idx] !== null) {
                        item.classList.add('status-wrong');
                    } else {
                        item.classList.add('status-unattempted');
                    }
                }

                if (isBookmarked) item.classList.add('bookmarked');

                item.addEventListener('click', () => loadQuestion(idx));
                paletteGrid.appendChild(item);
            });
        }

        function updatePaletteCurrent() {
            const items = paletteGrid.querySelectorAll('.palette-item');
            items.forEach(item => {
                if (parseInt(item.textContent) === currentQuestionIdx + 1) {
                    item.classList.add('current');
                } else {
                    item.classList.remove('current');
                }
            });
        }

        function submitQuiz() {
            if (confirm("Are you sure you want to submit the quiz?")) {
                finalizeQuiz();
            }
        }

        function autoSubmitQuiz() {
            alert("Time has expired! Your quiz will be submitted automatically.");
            finalizeQuiz();
        }

        function finalizeQuiz() {
            isSubmitted = true;
            clearInterval(timerInterval);

            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;

            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    score++;
                    correctCount++;
                } else if (userAnswers[idx] !== null) {
                    incorrectCount++;
                }
            });

            const percentage = ((score / questions.length) * 100).toFixed(1);

            // Update Modal Stats
            document.getElementById('modal-score').textContent = score;
            document.getElementById('stat-percentage').textContent = `${percentage}%`;
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-incorrect').textContent = incorrectCount;

            const badge = document.getElementById('pass-fail-badge');
            if (percentage >= 60) {
                badge.textContent = "PASSED";
                badge.style.color = "var(--success)";
            } else {
                badge.textContent = "NEEDS IMPROVEMENT";
                badge.style.color = "var(--danger)";
            }

            // Show Score Modal
            scoreModal.classList.add('active');

            // Hide clear and submit buttons, disable timer
            submitBtn.style.display = 'none';
            clearBtn.style.display = 'none';
            timerDisplay.textContent = 'Completed';

            // Update legend for review mode
            document.getElementById('legend-container').innerHTML = `
                <div class="legend-item"><div class="legend-color" style="background:var(--success)"></div> Correct</div>
                <div class="legend-item"><div class="legend-color" style="background:var(--danger)"></div> Incorrect</div>
                <div class="legend-item"><div class="legend-color" style="background:var(--bg-primary); border:1px solid var(--border-color)"></div> Unattempted</div>
            `;

            renderPalette();
            loadQuestion(currentQuestionIdx);
        }

        function setupEventListeners() {
            prevBtn.addEventListener('click', () => {
                if (currentQuestionIdx > 0) loadQuestion(currentQuestionIdx - 1);
            });

            nextBtn.addEventListener('click', () => {
                if (currentQuestionIdx < questions.length - 1) loadQuestion(currentQuestionIdx + 1);
            });

            clearBtn.addEventListener('click', clearSelection);
            bookmarkBtn.addEventListener('click', toggleBookmark);
            submitBtn.addEventListener('click', submitQuiz);

            paletteFilter.addEventListener('change', renderPalette);

            reviewBtn.addEventListener('click', () => {
                scoreModal.classList.remove('active');
            });

            // Reshuffle / Restart Button
            restartBtn.addEventListener('click', () => {
                if (confirm("This will reshuffle all questions & options and restart the quiz timer. Proceed?")) {
                    startNewQuiz();
                }
            });

            // Theme Toggle
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    document.documentElement.removeAttribute('data-theme');
                    themeToggle.textContent = '🌙';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeToggle.textContent = '☀️';
                }
            });
        }
    </script>
</body>
</html>
