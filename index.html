<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCS (LTC) 50-MCQ Interactive Test</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef2f7;
  color: #172033;
}
.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 15px;
}
.card {
  background: #ffffff;
  border: 1px solid #d5dce5;
  border-radius: 14px;
  padding: 28px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}
h1 { font-size: 29px; margin: 0 0 8px; color: #102a43; }
.subtitle { color: #52606d; margin: 0 0 22px; font-size: 16px; }
#counter {
  font-weight: bold;
  font-size: 17px;
  margin-bottom: 9px;
}
.progress {
  height: 12px;
  background: #d9e2ec;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 24px;
}
.bar {
  height: 100%;
  width: 0%;
  background: #1565c0;
  transition: width .2s;
}
#question {
  font-size: 21px;
  line-height: 1.45;
  margin: 0 0 18px;
}
.option {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 16px 18px;
  text-align: left;
  font-size: 17px;
  line-height: 1.4;
  color: #172033;
  background: #ffffff;
  border: 2px solid #9aa9b8;
  border-radius: 10px;
  cursor: pointer;
  transition: .15s;
}
.option:hover:not(:disabled) {
  background: #f0f6ff;
  border-color: #1565c0;
}
.option:disabled { cursor: default; }
.option.correct {
  background: #e8f5e9;
  border-color: #2e7d32;
}
.option.wrong {
  background: #ffebee;
  border-color: #c62828;
}
.feedback {
  display: none;
  margin-top: 18px;
  padding: 15px;
  border-radius: 10px;
  background: #f4f7fa;
  border-left: 5px solid #1565c0;
  font-size: 16px;
  line-height: 1.45;
}
#next {
  margin-top: 20px;
  padding: 13px 24px;
  border: 0;
  border-radius: 9px;
  background: #1565c0;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
#next:disabled { background: #9fb7d1; cursor: not-allowed; }
.result { text-align: center; }
.score { font-size: 52px; font-weight: bold; color: #1565c0; }
.result button {
  padding: 13px 24px;
  border: 0;
  border-radius: 9px;
  background: #1565c0;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
@media (max-width: 600px) {
  .card { padding: 20px; }
  h1 { font-size: 24px; }
  #question { font-size: 19px; }
  .option { font-size: 16px; }
}
</style>
</head>
<body>
