<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCS (LTC) 50-MCQ Interactive Test</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef2f7;
  color: #172033;
}
.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 15px;
}
.card {
  background: #ffffff;
  border: 1px solid #d5dce5;
  border-radius: 14px;
  padding: 28px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}
h1 { font-size: 29px; margin: 0 0 8px; color: #102a43; }
.subtitle { color: #52606d; margin: 0 0 22px; font-size: 16px; }
#counter {
  font-weight: bold;
  font-size: 17px;
  margin-bottom: 9px;
}
.progress {
  height: 12px;
  background: #d9e2ec;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 24px;
}
.bar {
  height: 100%;
  width: 0%;
  background: #1565c0;
  transition: width .2s;
}
#question {
  font-size: 21px;
  line-height: 1.45;
  margin: 0 0 18px;
}
.option {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 16px 18px;
  text-align: left;
  font-size: 17px;
  line-height: 1.4;
  color: #172033;
  background: #ffffff;
  border: 2px solid #9aa9b8;
  border-radius: 10px;
  cursor: pointer;
  transition: .15s;
}
.option:hover:not(:disabled) {
  background: #f0f6ff;
  border-color: #1565c0;
}
.option:disabled { cursor: default; }
.option.correct {
  background: #e8f5e9;
  border-color: #2e7d32;
}
.option.wrong {
  background: #ffebee;
  border-color: #c62828;
}
.feedback {
  display: none;
  margin-top: 18px;
  padding: 15px;
  border-radius: 10px;
  background: #f4f7fa;
  border-left: 5px solid #1565c0;
  font-size: 16px;
  line-height: 1.45;
}
#next {
  margin-top: 20px;
  padding: 13px 24px;
  border: 0;
  border-radius: 9px;
  background: #1565c0;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
#next:disabled { background: #9fb7d1; cursor: not-allowed; }
.result { text-align: center; }
.score { font-size: 52px; font-weight: bold; color: #1565c0; }
.result button {
  padding: 13px 24px;
  border: 0;
  border-radius: 9px;
  background: #1565c0;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
@media (max-width: 600px) {
  .card { padding: 20px; }
  h1 { font-size: 24px; }
  #question { font-size: 19px; }
  .option { font-size: 16px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>CCS (LTC) 50-MCQ Interactive Test</h1>
    <p class="subtitle">Central Civil Services (Leave Travel Concession) Rules, 1988</p>
    <div style="margin-bottom:24px;">
  <a href="Joining-time.html"
     style="display:inline-block;padding:12px 18px;
            background:#1565c0;color:white;
            text-decoration:none;border-radius:9px;
            font-weight:bold;">
    📝 Quiz 2 – CCS Joining Time
  </a>
</div>

    <div id="quiz">
      <div id="counter">Loading question...</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div id="question">Loading...</div>
      <div id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button id="next" type="button" disabled>Next Question</button>
    </div>

    <div id="result" class="result" style="display:none;">
      <h2>Test Completed</h2>
      <div class="score" id="score"></div>
      <p id="percentage"></p>
      <p id="message"></p>
      <button type="button" onclick="restart()">Restart Test</button>
    </div>
  </div>
</div>

<script>
const questions = [{"q": "Under the CCS (LTC) Rules, 1988, what is the basic purpose of LTC?", "options": ["To provide a medical reimbursement", "To provide a concession for travel during leave", "To provide a pension benefit", "To provide a housing allowance"], "answer": "B"}, {"q": "What does LTC stand for in CCS service rules?", "options": ["Leave Travel Concession", "Leave Transfer Certificate", "Local Travel Compensation", "Leave Transport Charge"], "answer": "A"}, {"q": "Under Rule 5, a Government servant is required to declare which place for Home Town LTC?", "options": ["Place of first posting", "Place of retirement", "Home Town", "Place of birth only"], "answer": "C"}, {"q": "Once a Home Town is declared and accepted, ordinarily how many times can it be changed during service?", "options": ["Unlimited times", "Every year", "Every block year", "Once, subject to the prescribed authority permitting the change"], "answer": "D"}, {"q": "LTC is primarily intended for travel during which situation?", "options": ["Suspension", "Official tour only", "Leave", "Training only"], "answer": "C"}, {"q": "Which category is generally covered by CCS (LTC) Rules, 1988?", "options": ["All Indian citizens", "Eligible Central Government servants", "Private-sector employees automatically", "State employees automatically"], "answer": "B"}, {"q": "A Home Town LTC can be converted into an LTC to an eligible destination under which broad concept?", "options": ["Daily allowance", "Anywhere in India LTC, subject to the applicable block and rules", "Joining time", "Medical reimbursement"], "answer": "B"}, {"q": "How frequently is the standard LTC block generally structured?", "options": ["Four calendar years", "Two months", "One calendar year", "Ten years"], "answer": "A"}, {"q": "What is commonly called the LTC for visiting a place other than the declared Home Town within the applicable block?", "options": ["Home Station LTC", "Office Tour LTC", "Joining LTC", "Anywhere in India LTC"], "answer": "D"}, {"q": "Which authority issues the CCS (LTC) Rules, 1988?", "options": ["Election Commission of India", "University Grants Commission", "Reserve Bank of India", "Government of India"], "answer": "D"}, {"q": "Can LTC and leave be treated as the same entitlement?", "options": ["No; LTC is a travel concession and leave is a separate service entitlement", "Yes, LTC automatically grants leave", "Yes, they are identical", "No, LTC cancels leave"], "answer": "A"}, {"q": "Before undertaking an LTC journey, what is an important procedural requirement?", "options": ["Obtain/sanction leave and comply with the prescribed LTC procedure", "Close the GPF account", "Obtain a passport for every domestic journey", "Resign from service"], "answer": "A"}, {"q": "Can LTC be availed for travel outside India under the normal CCS LTC Rules?", "options": ["No, normal LTC is for travel within India", "Yes, without any restriction", "Yes, for every foreign country", "Yes, for neighbouring countries only"], "answer": "A"}, {"q": "Which of the following is a premium train category specifically recognized for LTC in recent DoPT instructions?", "options": ["Private tourist bus only", "Vande Bharat Express", "Metro Rail only", "Toy Train only"], "answer": "B"}, {"q": "Which other premium train categories have been specifically recognized for LTC along with Vande Bharat in recent instructions?", "options": ["Local passenger trains only", "Rajdhani and Shatabdi only", "Tejas Express and Humsafar Express", "Tram services only"], "answer": "C"}, {"q": "Special air-travel dispensation for LTC has covered which of the following regions/UTs under DoPT extensions?", "options": ["Only Delhi and Mumbai", "Only Goa", "Only Kerala", "NER, J&K, Ladakh and Andaman & Nicobar"], "answer": "D"}, {"q": "Under the special dispensation, the air-travel concession can be availed in lieu of which LTC?", "options": ["Home Town LTC or against Anywhere in India LTC, subject to the applicable order", "Casual leave only", "Study leave only", "Medical leave only"], "answer": "A"}, {"q": "Which statement about NER is correct?", "options": ["Sikkim is never included", "Only Meghalaya is NER", "Only Assam is NER", "Sikkim is included in the North Eastern Region for the relevant LTC air-travel provisions"], "answer": "D"}, {"q": "Under the special LTC air provisions, can an employee travel by helicopter as a normal LTC air journey?", "options": ["Yes, whenever cheaper than rail", "Yes, for all mountain routes", "No", "Yes, without restriction"], "answer": "C"}, {"q": "Can private airlines be used for eligible LTC air travel when the applicable Government conditions permit it?", "options": ["Only chartered aircraft", "Yes", "No, never", "Only foreign airlines"], "answer": "B"}, {"q": "If an airline charges full fare for an eligible child and the fare is actually paid, what is the relevant principle?", "options": ["Nothing can ever be reimbursed", "Only airport tax can be reimbursed", "Only half the fare can be reimbursed", "The full fare charged may be reimbursed subject to the applicable LTC rules"], "answer": "D"}, {"q": "What is the purpose of declaring a Home Town under LTC?", "options": ["To fix basic pay", "To determine pension automatically", "To establish the place against which Home Town LTC is admissible", "To determine seniority"], "answer": "C"}, {"q": "Which factor may be considered when assessing a Home Town declaration?", "options": ["Office canteen preference", "Preferred airline", "Permanent residence and relevant family/property circumstances", "Favourite tourist destination"], "answer": "C"}, {"q": "If an employee owns property in more than one place, what is broadly relevant to Home Town declaration?", "options": ["Only the newest property counts", "The employee may make a choice with reasons, subject to the competent authority's decision", "The employee must select the farthest property", "Any property automatically becomes the Home Town"], "answer": "B"}, {"q": "What does Rule 18 of the CCS (LTC) Rules relate to?", "options": ["Medical reimbursement", "Promotion", "Disciplinary penalties", "Power to relax"], "answer": "D"}, {"q": "Why is the Power to Relax provision important in LTC administration?", "options": ["It makes all foreign travel admissible", "It permits relaxation in appropriate cases within the authority and conditions prescribed by the Rules", "It allows every employee to ignore all LTC rules", "It removes the need for sanction"], "answer": "B"}, {"q": "Can an employee normally claim LTC reimbursement for a journey undertaken without complying with the prescribed procedural requirements?", "options": ["Yes, automatically", "Yes, without any supporting documents", "Yes, even without leave", "The claim can be affected; prescribed procedural requirements must be followed"], "answer": "D"}, {"q": "What is meant by LTC advance?", "options": ["A monthly salary increase", "An advance of admissible travel reimbursement subject to adjustment under the rules", "A permanent bonus", "A pension advance"], "answer": "B"}, {"q": "What should an employee generally do if an LTC advance is received but the journey is not undertaken?", "options": ["Keep it permanently", "Follow the prescribed rules for refund/recovery of the advance", "Convert it to GPF automatically", "Treat it as a bonus"], "answer": "B"}, {"q": "Can earned leave be encashed while availing LTC, subject to the applicable conditions?", "options": ["No, never", "Yes", "Only during suspension", "Only during retirement"], "answer": "B"}, {"q": "What is the commonly applicable maximum earned-leave encashment linked with one LTC occasion?", "options": ["Up to 10 days, subject to the rules", "Up to 60 days every time", "Unlimited days", "Up to 90 days every time"], "answer": "A"}, {"q": "What is the overall service ceiling commonly applicable to EL encashment with LTC?", "options": ["60 days during the entire service, subject to the applicable rules", "365 days", "10 days during entire service", "No ceiling"], "answer": "A"}, {"q": "Does LTC itself create a right to additional leave?", "options": ["Yes, automatically", "No; leave sanction is governed separately", "Yes, 30 days per LTC", "Yes, one month for every journey"], "answer": "B"}, {"q": "Is the fare reimbursement under LTC intended to cover any amount an employee chooses to spend?", "options": ["Yes, regardless of route", "Yes, unlimited", "Yes, including luxury upgrades", "No; reimbursement is governed by admissibility, entitled class/mode and applicable limits"], "answer": "D"}, {"q": "Why is the employee's entitled class important in LTC?", "options": ["It determines pension", "It determines promotion", "It determines office location", "Reimbursement is linked to the applicable travel entitlement and rules"], "answer": "D"}, {"q": "Can an employee claim reimbursement for a route or mode that is not admissible merely because it was personally preferred?", "options": ["Yes, if leave was sanctioned", "Yes, always", "Yes, if the hotel was cheap", "No"], "answer": "D"}, {"q": "What is an important distinction between official tour and LTC?", "options": ["Official tour is for official duty; LTC is a personal travel concession subject to LTC rules", "They are identical", "Official tour is a personal concession", "LTC is official duty"], "answer": "A"}, {"q": "What is the purpose of retaining tickets/receipts and other prescribed records?", "options": ["To claim promotion", "To increase leave balance", "To change Home Town automatically", "To support verification and settlement of the LTC claim"], "answer": "D"}, {"q": "Can an employee claim LTC simply because a family member travelled, without satisfying the applicable family eligibility and conditions?", "options": ["Yes, for any friend", "Yes, for any colleague", "Yes, automatically", "No; family eligibility and other conditions must be satisfied"], "answer": "D"}, {"q": "For LTC, the term 'family' is determined by what?", "options": ["The employee's declaration alone", "The definition and conditions prescribed under the CCS (LTC) Rules", "The airline's policy", "Personal preference"], "answer": "B"}, {"q": "Which statement is safest regarding the latest special LTC air dispensation?", "options": ["Its validity depends on the specific DoPT order and its stated period", "It is permanently valid forever", "It applies without any date limit", "It applies to all foreign travel"], "answer": "A"}, {"q": "The DoPT annual report for 2024-25 states that the special air dispensation was extended from 26 September 2024 up to which date?", "options": ["31 December 2026", "31 March 2027", "25 September 2026", "25 September 2025"], "answer": "C"}, {"q": "Which train was added to the list of premium trains admissible under LTC in the cited 14 January 2025 DoPT instruction?", "options": ["Vande Bharat Express", "Delhi Metro", "Kolkata Metro", "Private luxury coach"], "answer": "A"}, {"q": "What is the best general approach when an LTC rule and a later DoPT clarification appear to differ?", "options": ["Always apply the oldest instruction", "Use the airline's terms", "Apply the current applicable rule/instruction and verify the latest DoPT clarification", "Ignore DoPT clarifications"], "answer": "C"}, {"q": "Can a Home Town be changed merely because the employee wants a more attractive tourist destination?", "options": ["Yes, once every month", "Yes, anytime", "No; a change is subject to the prescribed conditions and authority", "Yes, every block"], "answer": "C"}, {"q": "What is the main role of the Controlling Officer in Home Town declaration?", "options": ["To examine and accept the declaration according to the applicable provisions", "To fix the employee's pension", "To choose the employee's tourist destination", "To book every train personally"], "answer": "A"}, {"q": "If headquarters and Home Town are the same, what is the key issue under special Home Town-conversion provisions?", "options": ["The employee gets unlimited LTC", "The employee must travel abroad", "The employee automatically gets two LTCs", "The employee may not have a Home Town LTC entitlement to convert, as specified in the applicable order"], "answer": "D"}, {"q": "What is the most important principle for an LTC claim?", "options": ["Leave sanction is unnecessary", "The journey and claim must satisfy the CCS (LTC) Rules and applicable Government instructions", "Any ticket is reimbursable", "Personal convenience overrides the rules"], "answer": "B"}, {"q": "Which department is the primary source for Central Government LTC instructions?", "options": ["Department of Personnel & Training (DoPT)", "Election Commission", "Ministry of Railways alone", "RBI"], "answer": "A"}, {"q": "Which statement best describes the relationship between LTC reimbursement and actual expenditure?", "options": ["Reimbursement is subject to the admissibility and limits prescribed by the applicable LTC rules", "Every amount spent is reimbursed without limit", "Only hotel expenses are reimbursed", "Only food expenses are reimbursed"], "answer": "A"}];

let current = 0;
let score = 0;
let answered = false;

function byId(id) {
  return document.getElementById(id);
}

function loadQuestion() {
  const item = questions[current];
  answered = false;

  byId("counter").textContent = "Question " + (current + 1) + " of " + questions.length;
  byId("bar").style.width = ((current / questions.length) * 100) + "%";
  byId("question").textContent = item.q;

  const optionsBox = byId("options");
  optionsBox.innerHTML = "";

  item.options.forEach(function(text, i) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";
    button.innerHTML = "<strong>" + "ABCD"[i] + ".</strong> " + text;
    button.addEventListener("click", function() {
      selectAnswer("ABCD"[i], button);
    });
    optionsBox.appendChild(button);
  });

  byId("feedback").style.display = "none";
  byId("feedback").textContent = "";
  byId("next").disabled = true;
}

function selectAnswer(letter, selectedButton) {
  if (answered) return;
  answered = true;

  const item = questions[current];
  const buttons = document.querySelectorAll(".option");

  buttons.forEach(function(button, i) {
    button.disabled = true;
    if ("ABCD"[i] === item.answer) {
      button.classList.add("correct");
    }
  });

  const feedback = byId("feedback");

  if (letter === item.answer) {
    score++;
    feedback.innerHTML = "<strong>Correct!</strong> Well done.";
  } else {
    selectedButton.classList.add("wrong");
    const correctIndex = "ABCD".indexOf(item.answer);
    feedback.innerHTML = "<strong>Incorrect.</strong> Correct answer: <strong>" +
      item.answer + ". " + item.options[correctIndex] + "</strong>";
  }

  feedback.style.display = "block";
  byId("next").disabled = false;
}

function showResult() {
  byId("quiz").style.display = "none";
  byId("result").style.display = "block";
  byId("bar").style.width = "100%";

  const percentage = Math.round((score / questions.length) * 100);
  byId("score").textContent = score + " / " + questions.length;
  byId("percentage").textContent = "Percentage: " + percentage + "%";
  byId("message").textContent =
    percentage >= 60 ? "Good performance!" : "Keep practising and try again.";
}

function restart() {
  current = 0;
  score = 0;
  byId("quiz").style.display = "block";
  byId("result").style.display = "none";
  loadQuestion();
}

byId("next").addEventListener("click", function() {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
});

loadQuestion();
</script>
</body>
</html>
